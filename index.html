<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quick Image Text Editor</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
    }
    .app {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .upload-box {
      background: #1e293b;
      border: 1px dashed #475569;
      border-radius: 12px;
      padding: 12px;
    }
    .upload-box label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="file"] {
      width: 100%;
      color: #e2e8f0;
      font-size: 13px;
    }

    /* Main Big Action Buttons */
    .main-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .big-btn {
      padding: 15px 12px;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      letter-spacing: 0.5px;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }
    .big-btn:active { transform: scale(0.98); }
    .big-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-edit { background: #3b82f6; }
    .btn-edit.active { background: #2563eb; box-shadow: 0 0 0 3px #93c5fd; }
    .btn-save-main { background: #10b981; }

    /* Sub Buttons spawned from Main SAVE */
    .export-choices {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #1e293b;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .export-choices.show { display: grid; }
    .sub-export-btn {
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
    }
    .btn-copy { background: #8b5cf6; }
    .btn-download-new { background: #059669; }

    /* Main Image Canvas */
    .canvas-wrap {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #mainCanvas {
      max-width: 100%;
      max-height: 58vh;
      border-radius: 8px;
      background: #1e293b;
      touch-action: none;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }

    /* Selected Area Inspector Box below image */
    .inspector-panel {
      display: none;
      background: #1e293b;
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 12px;
      flex-direction: column;
      gap: 10px;
    }
    .inspector-panel.show { display: flex; }
    .inspector-top {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    #zoomCanvas {
      border: 2px solid #38bdf8;
      border-radius: 8px;
      background: #020617;
      max-width: 100%;
      touch-action: none;
    }
    .fields {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    .row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .mini-lbl {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 3px;
    }
    input[type="color"] {
      width: 100%;
      height: 34px;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #0f172a;
      padding: 2px;
    }
    .inspector-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-area-save {
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #10b981;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-area-reset {
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #475569;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .toast {
      font-size: 12px;
      color: #34d399;
      text-align: center;
      min-height: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="upload-box">
      <label>ပုံတင်ရန် (Upload Image)</label>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <!-- Big EDIT & SAVE Buttons -->
    <div class="main-actions">
      <button class="big-btn btn-edit" id="editModeBtn" disabled>EDIT</button>
      <button class="big-btn btn-save-main" id="mainSaveBtn" disabled>SAVE</button>
    </div>

    <!-- Spawned Copy & Save Buttons after clicking Main SAVE -->
    <div class="export-choices" id="exportChoices">
      <button class="sub-export-btn btn-copy" id="copyImgBtn">Copy</button>
      <button class="sub-export-btn btn-download-new" id="downloadNewBtn">Save</button>
    </div>

    <!-- Image Canvas -->
    <div class="canvas-wrap">
      <canvas id="mainCanvas" width="500" height="500"></canvas>
      <div class="hint" id="hintText">ပုံတင်ပြီး EDIT ကိုနှိပ်၍ ပုံပေါ်မှ ပြင်လိုသောစာသားနေရာကို နှိပ်ပါ</div>
    </div>

    <!-- Inspector Box Below Image when a spot is tapped -->
    <div class="inspector-panel" id="inspectorPanel">
      <div class="inspector-top">
        <div>
          <span class="mini-lbl">ရွေးထားသော နေရာဘောင်</span>
          <canvas id="zoomCanvas" width="220" height="80"></canvas>
        </div>
        <div class="fields">
          <div>
            <span class="mini-lbl">စာသားအသစ် (မရိုက်လည်း နေရာကို ဖုံးအုပ်နိုင်သည်)</span>
            <input type="text" id="replaceText" placeholder="ပြောင်းလဲမည့် စာသားရိုက်ပါ..." />
          </div>
          <div class="row-3">
            <div>
              <span class="mini-lbl">နောက်ခံအရောင်</span>
              <input type="color" id="bgCoverColor" value="#ffffff" />
            </div>
            <div>
              <span class="mini-lbl">စာသားအရောင်</span>
              <input type="color" id="newTextColor" value="#0f172a" />
            </div>
            <div>
              <span class="mini-lbl">စာလုံးဆိုဒ်</span>
              <input type="number" id="newFontSize" value="20" min="8" max="150" />
            </div>
          </div>
        </div>
      </div>

      <div class="inspector-actions">
        <button class="btn-area-save" id="areaSaveBtn">Save</button>
        <button class="btn-area-reset" id="areaResetBtn">Reset</button>
      </div>
    </div>

    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const editModeBtn = document.getElementById("editModeBtn");
    const mainSaveBtn = document.getElementById("mainSaveBtn");
    const exportChoices = document.getElementById("exportChoices");
    const copyImgBtn = document.getElementById("copyImgBtn");
    const downloadNewBtn = document.getElementById("downloadNewBtn");

    const mainCanvas = document.getElementById("mainCanvas");
    const ctx = mainCanvas.getContext("2d");
    const zoomCanvas = document.getElementById("zoomCanvas");
    const zCtx = zoomCanvas.getContext("2d");

    const inspectorPanel = document.getElementById("inspectorPanel");
    const replaceText = document.getElementById("replaceText");
    const bgCoverColor = document.getElementById("bgCoverColor");
    const newTextColor = document.getElementById("newTextColor");
    const newFontSize = document.getElementById("newFontSize");
    const areaSaveBtn = document.getElementById("areaSaveBtn");
    const areaResetBtn = document.getElementById("areaResetBtn");
    const hintText = document.getElementById("hintText");
    const toastMsg = document.getElementById("toastMsg");

    let originalImg = null;
    // committedPatches: { x, y, w, h, bgColor, text, textColor, fontSize }
    let committedPatches = [];
    let editMode = false;
    let activeBox = null; // { x, y, w, h }
    let isDraggingBox = false;
    let dragDx = 0;
    let dragDy = 0;

    function showToast(msg) {
      toastMsg.textContent = msg;
      setTimeout(() => {
        if (toastMsg.textContent === msg) toastMsg.textContent = "";
      }, 3000);
    }

    function renderMain(includeSelectionBox = true) {
      ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      if (!originalImg) {
        ctx.fillStyle = "#94a3b8";
        ctx.font = "15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("ပုံတစ်ပုံ ရွေးချယ်ပါ", mainCanvas.width / 2, mainCanvas.height / 2);
        ctx.textAlign = "start";
        return;
      }

      ctx.drawImage(originalImg, 0, 0, mainCanvas.width, mainCanvas.height);

      // Draw saved replacements
      for (const p of committedPatches) {
        ctx.fillStyle = p.bgColor;
        ctx.fillRect(p.x, p.y, p.w, p.h);

        if (p.text) {
          ctx.fillStyle = p.textColor;
          ctx.font = `bold ${p.fontSize}px sans-serif`;
          ctx.textBaseline = "middle";
          ctx.fillText(p.text, p.x + 6, p.y + p.h / 2);
          ctx.textBaseline = "alphabetic";
        }
      }

      // Draw current active selection box while editing
      if (includeSelectionBox && editMode && activeBox) {
        ctx.save();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = Math.max(2, mainCanvas.width / 220);
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(activeBox.x, activeBox.y, activeBox.w, activeBox.h);
        ctx.restore();
      }
    }

    function renderZoomPreview() {
      zCtx.clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);
      if (!originalImg || !activeBox) return;

      // Render current state onto an offscreen canvas to sample exact pixels
      const off = document.createElement("canvas");
      off.width = mainCanvas.width;
      off.height = mainCanvas.height;
      const oCtx = off.getContext("2d");
      oCtx.drawImage(originalImg, 0, 0, off.width, off.height);
      for (const p of committedPatches) {
        oCtx.fillStyle = p.bgColor;
        oCtx.fillRect(p.x, p.y, p.w, p.h);
        if (p.text) {
          oCtx.fillStyle = p.textColor;
          oCtx.font = `bold ${p.fontSize}px sans-serif`;
          oCtx.textBaseline = "middle";
          oCtx.fillText(p.text, p.x + 6, p.y + p.h / 2);
        }
      }

      // Auto-detect average background color around the box edges
      try {
        const sampleX = Math.max(0, Math.floor(activeBox.x));
        const sampleY = Math.max(0, Math.floor(activeBox.y));
        const px = oCtx.getImageData(sampleX, sampleY, 1, 1).data;
        const hex = "#" + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, "0")).join("");
        bgCoverColor.value = hex;
      } catch (_) {}

      zCtx.drawImage(
        off,
        activeBox.x,
        activeBox.y,
        activeBox.w,
        activeBox.h,
        0,
        0,
        zoomCanvas.width,
        zoomCanvas.height
      );
    }

    function getCoords(clientX, clientY) {
      const rect = mainCanvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * mainCanvas.width,
        y: ((clientY - rect.top) / rect.height) * mainCanvas.height
      };
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          originalImg = img;
          mainCanvas.width = img.width;
          mainCanvas.height = img.height;
          committedPatches = [];
          activeBox = null;
          editMode = false;
          editModeBtn.classList.remove("active");
          editModeBtn.disabled = false;
          mainSaveBtn.disabled = false;
          inspectorPanel.classList.remove("show");
          exportChoices.classList.remove("show");
          hintText.textContent = "EDIT ကိုနှိပ်ပြီး ပုံပေါ်က စာသားတစ်ခုကို နှိပ်ပါ";
          renderMain();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    editModeBtn.addEventListener("click", () => {
      if (!originalImg) return;
      editMode = !editMode;
      editModeBtn.classList.toggle("active", editMode);
      if (editMode) {
        hintText.textContent = "ပုံပေါ်က ပြင်ချင်တဲ့ စာသားနေရာကို နှိပ်ပါ (ဘောင်ကိုလည်း ဆွဲရွှေ့နိုင်သည်)";
      } else {
        activeBox = null;
        inspectorPanel.classList.remove("show");
        hintText.textContent = "Edit Mode ပိတ်ထားပါသည်";
      }
      renderMain();
    });

    function onPointerDown(clientX, clientY) {
      if (!originalImg || !editMode) return;
      const pt = getCoords(clientX, clientY);

      const defaultW = Math.max(90, Math.round(mainCanvas.width * 0.28));
      const defaultH = Math.max(28, Math.round(mainCanvas.height * 0.055));

      if (
        activeBox &&
        pt.x >= activeBox.x &&
        pt.x <= activeBox.x + activeBox.w &&
        pt.y >= activeBox.y &&
        pt.y <= activeBox.y + activeBox.h
      ) {
        isDraggingBox = true;
        dragDx = pt.x - activeBox.x;
        dragDy = pt.y - activeBox.y;
        return;
      }

      activeBox = {
        x: Math.max(0, Math.min(mainCanvas.width - defaultW, Math.round(pt.x - defaultW / 2))),
        y: Math.max(0, Math.min(mainCanvas.height - defaultH, Math.round(pt.y - defaultH / 2))),
        w: defaultW,
        h: defaultH
      };

      newFontSize.value = Math.max(12, Math.round(defaultH * 0.65));
      replaceText.value = "";
      inspectorPanel.classList.add("show");
      renderMain();
      renderZoomPreview();
    }

    function onPointerMove(clientX, clientY) {
      if (!isDraggingBox || !activeBox) return;
      const pt = getCoords(clientX, clientY);
      activeBox.x = Math.max(0, Math.min(mainCanvas.width - activeBox.w, Math.round(pt.x - dragDx)));
      activeBox.y = Math.max(0, Math.min(mainCanvas.height - activeBox.h, Math.round(pt.y - dragDy)));
      renderMain();
      renderZoomPreview();
    }

    function onPointerUp() {
      isDraggingBox = false;
    }

    mainCanvas.addEventListener("mousedown", (e) => onPointerDown(e.clientX, e.clientY));
    window.addEventListener("mousemove", (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", onPointerUp);

    mainCanvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    mainCanvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && isDraggingBox) {
        e.preventDefault();
        onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    mainCanvas.addEventListener("touchend", onPointerUp);

    // Area Save button (replaces text in selected area)
    areaSaveBtn.addEventListener("click", () => {
      if (!activeBox) return;
      committedPatches.push({
        x: activeBox.x,
        y: activeBox.y,
        w: activeBox.w,
        h: activeBox.h,
        bgColor: bgCoverColor.value,
        text: replaceText.value,
        textColor: newTextColor.value,
        fontSize: Number(newFontSize.value) || 20
      });
      activeBox = null;
      inspectorPanel.classList.remove("show");
      renderMain();
      showToast("ရွေးထားသော နေရာကို ပြောင်းလဲပြီးပါပြီ");
    });

    // Area Reset button (cancels current selection box)
    areaResetBtn.addEventListener("click", () => {
      activeBox = null;
      replaceText.value = "";
      inspectorPanel.classList.remove("show");
      renderMain();
      showToast("Reset ပြုလုပ်ပြီးပါပြီ");
    });

    // Main SAVE button spawns Copy & Save buttons
    mainSaveBtn.addEventListener("click", () => {
      if (!originalImg) return;
      editMode = false;
      editModeBtn.classList.remove("active");
      activeBox = null;
      inspectorPanel.classList.remove("show");
      renderMain(false);
      exportChoices.classList.add("show");
      showToast("အောက်မှ Copy သို့မဟုတ် Save ကို ရွေးပါ");
    });

    function getFinalDataUrl() {
      renderMain(false);
      return mainCanvas.toDataURL("image/png");
    }

    // Copy image to clipboard
    copyImgBtn.addEventListener("click", async () => {
      if (!originalImg) return;
      try {
        renderMain(false);
        const blob = await new Promise((resolve) => mainCanvas.toBlob(resolve, "image/png"));
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          showToast("ပုံကို Copy ကူးပြီးပါပြီ (Paste ချသုံးနိုင်ပါပြီ)");
        } else {
          showToast("ဒီ Browser မှာ Copy မပံ့ပိုးပါ၊ Save ကိုနှိပ်၍ သိမ်းပါ");
        }
      } catch (err) {
        showToast("Copy ကူးမရပါ၊ Save ကိုနှိပ်၍ ပုံအသစ်သိမ်းပါ");
      }
    });

    // Save as a new image file on phone/computer
    downloadNewBtn.addEventListener("click", () => {
      if (!originalImg) return;
      const dataUrl = getFinalDataUrl();
      const stamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);
      const link = document.createElement("a");
      link.download = `edited-${stamp}.png`;
      link.href = dataUrl;
      link.click();
      showToast(`ပုံအသစ် (${link.download}) သိမ်းဆည်းပြီးပါပြီ`);
    });

    renderMain();
  </script>
</body>
</html>
