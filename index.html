<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quick Image Text Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0f172a;
      --canvas-bg: #020617;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --input-border: #475569;
    }
    :root[data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-2: #f8fafc;
      --canvas-bg: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --input-border: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .app {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Bar: Theme & Language */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .top-pill-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .top-pill-btn:active { opacity: 0.85; }

    .upload-box {
      background: var(--card);
      border: 1px dashed var(--input-border);
      border-radius: 12px;
      padding: 12px;
    }
    .upload-box label {
      display: block;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="file"] {
      width: 100%;
      color: var(--text);
      font-size: 13px;
    }

    /* Main Big Action Buttons */
    .main-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .big-btn {
      padding: 15px 12px;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      letter-spacing: 0.5px;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }
    .big-btn:active { transform: scale(0.98); }
    .big-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-edit { background: #3b82f6; }
    .btn-edit.active { background: #2563eb; box-shadow: 0 0 0 3px #93c5fd; }
    .btn-save-main { background: #10b981; }

    /* Sub Buttons spawned from Main SAVE */
    .export-choices {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--card);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .export-choices.show { display: grid; }
    .sub-export-btn {
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
    }
    .btn-copy { background: #8b5cf6; }
    .btn-download-new { background: #059669; }

    /* Main Image Canvas */
    .canvas-wrap {
      background: var(--canvas-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #mainCanvas {
      max-width: 100%;
      max-height: 58vh;
      border-radius: 8px;
      background: var(--card);
      touch-action: none;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    /* Selected Area Inspector Box below image */
    .inspector-panel {
      display: none;
      background: var(--card);
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 12px;
      flex-direction: column;
      gap: 10px;
    }
    .inspector-panel.show { display: flex; }
    .inspector-top {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    #zoomCanvas {
      border: 2px solid #38bdf8;
      border-radius: 8px;
      background: var(--canvas-bg);
      max-width: 100%;
      touch-action: none;
    }
    .fields {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
    }
    .row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .mini-lbl {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }
    input[type="color"] {
      width: 100%;
      height: 34px;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      background: var(--card-2);
      padding: 2px;
    }
    .inspector-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-area-save {
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #10b981;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-area-reset {
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #475569;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .toast {
      font-size: 12px;
      color: #10b981;
      text-align: center;
      min-height: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Top Theme & Language Controls -->
    <div class="top-bar">
      <button class="top-pill-btn" id="themeToggleBtn">☀️ Light</button>
      <button class="top-pill-btn" id="langToggleBtn">🌐 English</button>
    </div>

    <div class="upload-box">
      <label id="uploadLabel">ပုံတင်ရန် (Upload Image)</label>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <!-- Big EDIT & SAVE Buttons -->
    <div class="main-actions">
      <button class="big-btn btn-edit" id="editModeBtn" disabled>EDIT</button>
      <button class="big-btn btn-save-main" id="mainSaveBtn" disabled>SAVE</button>
    </div>

    <!-- Spawned Copy & Save Buttons after clicking Main SAVE -->
    <div class="export-choices" id="exportChoices">
      <button class="sub-export-btn btn-copy" id="copyImgBtn">Copy</button>
      <button class="sub-export-btn btn-download-new" id="downloadNewBtn">Save</button>
    </div>

    <!-- Image Canvas -->
    <div class="canvas-wrap">
      <canvas id="mainCanvas" width="500" height="500"></canvas>
      <div class="hint" id="hintText">ပုံတင်ပြီး EDIT ကိုနှိပ်၍ ပုံပေါ်မှ ပြင်လိုသောစာသားနေရာကို နှိပ်ပါ</div>
    </div>

    <!-- Inspector Box Below Image when a spot is tapped -->
    <div class="inspector-panel" id="inspectorPanel">
      <div class="inspector-top">
        <div>
          <span class="mini-lbl" id="zoomBoxLabel">ရွေးထားသော နေရာဘောင်</span>
          <canvas id="zoomCanvas" width="220" height="80"></canvas>
        </div>
        <div class="fields">
          <div>
            <span class="mini-lbl" id="newTextLabel">စာသားအသစ် (နှိပ်လိုက်သော စာသားပေါ်လာမည်၊ စိတ်ကြိုက်ပြင်နိုင်သည်)</span>
            <input type="text" id="replaceText" placeholder="ပြောင်းလဲမည့် စာသားရိုက်ပါ..." />
          </div>
          <div class="row-3">
            <div>
              <span class="mini-lbl" id="bgColorLabel">နောက်ခံအရောင်</span>
              <input type="color" id="bgCoverColor" value="#ffffff" />
            </div>
            <div>
              <span class="mini-lbl" id="textColorLabel">စာသားအရောင်</span>
              <input type="color" id="newTextColor" value="#0f172a" />
            </div>
            <div>
              <span class="mini-lbl" id="fontSizeLabel">စာလုံးဆိုဒ်</span>
              <input type="number" id="newFontSize" value="20" min="8" max="150" />
            </div>
          </div>
        </div>
      </div>

      <div class="inspector-actions">
        <button class="btn-area-save" id="areaSaveBtn">Save</button>
        <button class="btn-area-reset" id="areaResetBtn">Reset</button>
      </div>
    </div>

    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    const i18n = {
      my: {
        toLight: "☀️ Light",
        toDark: "🌙 Dark",
        toEn: "🌐 English",
        toMy: "🌐 မြန်မာ",
        uploadLabel: "ပုံတင်ရန် (Upload Image)",
        placeholderCanvas: "ပုံတစ်ပုံ ရွေးချယ်ပါ",
        hintInitial: "ပုံတင်ပြီး EDIT ကိုနှိပ်၍ ပုံပေါ်မှ ပြင်လိုသောစာသားနေရာကို နှိပ်ပါ",
        hintReady: "EDIT ကိုနှိပ်ပြီး ပုံပေါ်က စာသားတစ်ခုကို နှိပ်ပါ",
        hintEditActive: "ပုံပေါ်က ပြင်ချင်တဲ့ စာသားနေရာကို နှိပ်ပါ (ဘောင်ကိုလည်း ဆွဲရွှေ့နိုင်သည်)",
        hintEditOff: "Edit Mode ပိတ်ထားပါသည်",
        zoomBoxLabel: "ရွေးထားသော နေရာဘောင်",
        newTextLabel: "စာသားအသစ် (နှိပ်လိုက်သော စာသားပေါ်လာမည်၊ စိတ်ကြိုက်ပြင်နိုင်သည်)",
        replacePlaceholder: "ပြောင်းလဲမည့် စာသားရိုက်ပါ...",
        bgColorLabel: "နောက်ခံအရောင်",
        textColorLabel: "စာသားအရောင်",
        fontSizeLabel: "စာလုံးဆိုဒ်",
        readingText: "ရွေးထားသော နေရာမှ စာသားကို ဖတ်နေပါသည်...",
        textDetected: "စာသားဖတ်ပြီးပါပြီ — လိုသလိုပြင်ပြီး Save နှိပ်ပါ",
        areaSaved: "ပုံပေါ်က စာသားကို အစားထိုးပြီးပါပြီ",
        areaReset: "Reset ပြုလုပ်ပြီးပါပြီ",
        chooseExport: "အောက်မှ Copy သို့မဟုတ် Save ကို ရွေးပါ",
        copied: "ပုံကို Copy ကူးပြီးပါပြီ (Paste ချသုံးနိုင်ပါပြီ)",
        copyUnsupported: "ဒီ Browser မှာ Copy မပံ့ပိုးပါ၊ Save ကိုနှိပ်၍ သိမ်းပါ",
        copyFailed: "Copy ကူးမရပါ၊ Save ကိုနှိပ်၍ ပုံအသစ်သိမ်းပါ",
        savedNew: (name) => `ပုံအသစ် (${name}) သိမ်းဆည်းပြီးပါပြီ`
      },
      en: {
        toLight: "☀️ Light",
        toDark: "🌙 Dark",
        toEn: "🌐 English",
        toMy: "🌐 မြန်မာ",
        uploadLabel: "Upload Image",
        placeholderCanvas: "Choose an image",
        hintInitial: "Upload an image, tap EDIT, then tap text on the image",
        hintReady: "Tap EDIT, then tap a text area on the image",
        hintEditActive: "Tap text on the image to edit (you can drag the box too)",
        hintEditOff: "Edit Mode is off",
        zoomBoxLabel: "Selected Area Box",
        newTextLabel: "New Text (Tapped text appears here; edit freely)",
        replacePlaceholder: "Type replacement text...",
        bgColorLabel: "Background",
        textColorLabel: "Text Color",
        fontSizeLabel: "Font Size",
        readingText: "Reading text from selected area...",
        textDetected: "Text detected — edit as desired and tap Save",
        areaSaved: "Text replaced on the image",
        areaReset: "Reset complete",
        chooseExport: "Choose Copy or Save below",
        copied: "Image copied to clipboard (ready to paste)",
        copyUnsupported: "Copy not supported in this browser; use Save",
        copyFailed: "Could not copy; use Save for a new image",
        savedNew: (name) => `Saved new image (${name})`
      }
    };

    let currentLang = "my";
    let currentTheme = "dark";

    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const langToggleBtn = document.getElementById("langToggleBtn");
    const fileInput = document.getElementById("fileInput");
    const editModeBtn = document.getElementById("editModeBtn");
    const mainSaveBtn = document.getElementById("mainSaveBtn");
    const exportChoices = document.getElementById("exportChoices");
    const copyImgBtn = document.getElementById("copyImgBtn");
    const downloadNewBtn = document.getElementById("downloadNewBtn");

    const mainCanvas = document.getElementById("mainCanvas");
    const ctx = mainCanvas.getContext("2d");
    const zoomCanvas = document.getElementById("zoomCanvas");
    const zCtx = zoomCanvas.getContext("2d");

    const inspectorPanel = document.getElementById("inspectorPanel");
    const replaceText = document.getElementById("replaceText");
    const bgCoverColor = document.getElementById("bgCoverColor");
    const newTextColor = document.getElementById("newTextColor");
    const newFontSize = document.getElementById("newFontSize");
    const areaSaveBtn = document.getElementById("areaSaveBtn");
    const areaResetBtn = document.getElementById("areaResetBtn");
    const hintText = document.getElementById("hintText");
    const toastMsg = document.getElementById("toastMsg");

    let originalImg = null;
    let committedPatches = [];
    let editMode = false;
    let activeBox = null;
    let isDraggingBox = false;
    let dragDx = 0;
    let dragDy = 0;
    let ocrRequestId = 0;

    function t(key, ...args) {
      const val = i18n[currentLang][key];
      return typeof val === "function" ? val(...args) : val;
    }

    function applyUILanguage() {
      document.getElementById("uploadLabel").textContent = t("uploadLabel");
      document.getElementById("zoomBoxLabel").textContent = t("zoomBoxLabel");
      document.getElementById("newTextLabel").textContent = t("newTextLabel");
      replaceText.placeholder = t("replacePlaceholder");
      document.getElementById("bgColorLabel").textContent = t("bgColorLabel");
      document.getElementById("textColorLabel").textContent = t("textColorLabel");
      document.getElementById("fontSizeLabel").textContent = t("fontSizeLabel");

      themeToggleBtn.textContent = currentTheme === "dark" ? t("toLight") : t("toDark");
      langToggleBtn.textContent = currentLang === "my" ? t("toEn") : t("toMy");

      if (!originalImg) {
        hintText.textContent = t("hintInitial");
      } else if (editMode) {
        hintText.textContent = t("hintEditActive");
      } else {
        hintText.textContent = t("hintReady");
      }
      renderMain();
    }

    themeToggleBtn.addEventListener("click", () => {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", currentTheme);
      themeToggleBtn.textContent = currentTheme === "dark" ? t("toLight") : t("toDark");
    });

    langToggleBtn.addEventListener("click", () => {
      currentLang = currentLang === "my" ? "en" : "my";
      document.documentElement.setAttribute("lang", currentLang);
      applyUILanguage();
    });

    function showToast(msg) {
      toastMsg.textContent = msg;
      setTimeout(() => {
        if (toastMsg.textContent === msg) toastMsg.textContent = "";
      }, 3000);
    }

    function renderMain(includeSelectionBox = true) {
      ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      if (!originalImg) {
        ctx.fillStyle = currentTheme === "dark" ? "#94a3b8" : "#475569";
        ctx.font = "15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t("placeholderCanvas"), mainCanvas.width / 2, mainCanvas.height / 2);
        ctx.textAlign = "start";
        return;
      }

      ctx.drawImage(originalImg, 0, 0, mainCanvas.width, mainCanvas.height);

      for (const p of committedPatches) {
        ctx.fillStyle = p.bgColor;
        ctx.fillRect(p.x, p.y, p.w, p.h);

        if (p.text) {
          ctx.fillStyle = p.textColor;
          ctx.font = `bold ${p.fontSize}px sans-serif`;
          ctx.textBaseline = "middle";
          ctx.fillText(p.text, p.x + 6, p.y + p.h / 2);
          ctx.textBaseline = "alphabetic";
        }
      }

      if (includeSelectionBox && editMode && activeBox) {
        ctx.save();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = Math.max(2, mainCanvas.width / 220);
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(activeBox.x, activeBox.y, activeBox.w, activeBox.h);
        ctx.restore();
      }
    }

    async function recognizeSelectedAreaText(box, reqId) {
      if (!window.Tesseract || !box) return;
      const cropCanvas = document.createElement("canvas");
      cropCanvas.width = Math.max(40, Math.round(box.w * 2));
      cropCanvas.height = Math.max(24, Math.round(box.h * 2));
      const cCtx = cropCanvas.getContext("2d");
      cCtx.fillStyle = "#ffffff";
      cCtx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
      cCtx.drawImage(
        zoomCanvas,
        0,
        0,
        zoomCanvas.width,
        zoomCanvas.height,
        0,
        0,
        cropCanvas.width,
        cropCanvas.height
      );

      showToast(t("readingText"));
      try {
        const result = await Tesseract.recognize(cropCanvas.toDataURL("image/png"), "eng+mya");
        if (reqId !== ocrRequestId) return;
        const detected = (result?.data?.text || "").replace(/\s+/g, " ").trim();
        if (detected) {
          replaceText.value = detected;
          showToast(t("textDetected"));
        } else {
          showToast("");
        }
      } catch (_) {
        if (reqId === ocrRequestId) showToast("");
      }
    }

    function renderZoomPreview(runOcr = false) {
      zCtx.clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);
      if (!originalImg || !activeBox) return;

      const off = document.createElement("canvas");
      off.width = mainCanvas.width;
      off.height = mainCanvas.height;
      const oCtx = off.getContext("2d");
      oCtx.drawImage(originalImg, 0, 0, off.width, off.height);
      for (const p of committedPatches) {
        oCtx.fillStyle = p.bgColor;
        oCtx.fillRect(p.x, p.y, p.w, p.h);
        if (p.text) {
          oCtx.fillStyle = p.textColor;
          oCtx.font = `bold ${p.fontSize}px sans-serif`;
          oCtx.textBaseline = "middle";
          oCtx.fillText(p.text, p.x + 6, p.y + p.h / 2);
        }
      }

      try {
        const sampleX = Math.max(0, Math.floor(activeBox.x));
        const sampleY = Math.max(0, Math.floor(activeBox.y));
        const px = oCtx.getImageData(sampleX, sampleY, 1, 1).data;
        const hex = "#" + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, "0")).join("");
        bgCoverColor.value = hex;
      } catch (_) {}

      zCtx.drawImage(
        off,
        activeBox.x,
        activeBox.y,
        activeBox.w,
        activeBox.h,
        0,
        0,
        zoomCanvas.width,
        zoomCanvas.height
      );

      if (runOcr) {
        const currentReq = ++ocrRequestId;
        recognizeSelectedAreaText({ ...activeBox }, currentReq);
      }
    }

    function getCoords(clientX, clientY) {
      const rect = mainCanvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * mainCanvas.width,
        y: ((clientY - rect.top) / rect.height) * mainCanvas.height
      };
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          originalImg = img;
          mainCanvas.width = img.width;
          mainCanvas.height = img.height;
          committedPatches = [];
          activeBox = null;
          editMode = false;
          editModeBtn.classList.remove("active");
          editModeBtn.disabled = false;
          mainSaveBtn.disabled = false;
          inspectorPanel.classList.remove("show");
          exportChoices.classList.remove("show");
          hintText.textContent = t("hintReady");
          renderMain();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    editModeBtn.addEventListener("click", () => {
      if (!originalImg) return;
      editMode = !editMode;
      editModeBtn.classList.toggle("active", editMode);
      if (editMode) {
        hintText.textContent = t("hintEditActive");
      } else {
        ocrRequestId++;
        activeBox = null;
        inspectorPanel.classList.remove("show");
        hintText.textContent = t("hintEditOff");
      }
      renderMain();
    });

    function onPointerDown(clientX, clientY) {
      if (!originalImg || !editMode) return;
      const pt = getCoords(clientX, clientY);

      const defaultW = Math.max(90, Math.round(mainCanvas.width * 0.28));
      const defaultH = Math.max(28, Math.round(mainCanvas.height * 0.055));

      if (
        activeBox &&
        pt.x >= activeBox.x &&
        pt.x <= activeBox.x + activeBox.w &&
        pt.y >= activeBox.y &&
        pt.y <= activeBox.y + activeBox.h
      ) {
        isDraggingBox = true;
        dragDx = pt.x - activeBox.x;
        dragDy = pt.y - activeBox.y;
        return;
      }

      activeBox = {
        x: Math.max(0, Math.min(mainCanvas.width - defaultW, Math.round(pt.x - defaultW / 2))),
        y: Math.max(0, Math.min(mainCanvas.height - defaultH, Math.round(pt.y - defaultH / 2))),
        w: defaultW,
        h: defaultH
      };

      newFontSize.value = Math.max(12, Math.round(defaultH * 0.65));
      replaceText.value = "";
      inspectorPanel.classList.add("show");
      renderMain();
      renderZoomPreview(true);
    }

    function onPointerMove(clientX, clientY) {
      if (!isDraggingBox || !activeBox) return;
      const pt = getCoords(clientX, clientY);
      activeBox.x = Math.max(0, Math.min(mainCanvas.width - activeBox.w, Math.round(pt.x - dragDx)));
      activeBox.y = Math.max(0, Math.min(mainCanvas.height - activeBox.h, Math.round(pt.y - dragDy)));
      renderMain();
      renderZoomPreview(false);
    }

    function onPointerUp() {
      if (isDraggingBox && activeBox) {
        isDraggingBox = false;
        const currentReq = ++ocrRequestId;
        recognizeSelectedAreaText({ ...activeBox }, currentReq);
      } else {
        isDraggingBox = false;
      }
    }

    mainCanvas.addEventListener("mousedown", (e) => onPointerDown(e.clientX, e.clientY));
    window.addEventListener("mousemove", (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", onPointerUp);

    mainCanvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    mainCanvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && isDraggingBox) {
        e.preventDefault();
        onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    mainCanvas.addEventListener("touchend", onPointerUp);

    areaSaveBtn.addEventListener("click", () => {
      if (!activeBox) return;
      ocrRequestId++;
      committedPatches.push({
        x: activeBox.x,
        y: activeBox.y,
        w: activeBox.w,
        h: activeBox.h,
        bgColor: bgCoverColor.value,
        text: replaceText.value,
        textColor: newTextColor.value,
        fontSize: Number(newFontSize.value) || 20
      });
      activeBox = null;
      inspectorPanel.classList.remove("show");
      renderMain();
      showToast(t("areaSaved"));
    });

    areaResetBtn.addEventListener("click", () => {
      ocrRequestId++;
      activeBox = null;
      replaceText.value = "";
      inspectorPanel.classList.remove("show");
      renderMain();
      showToast(t("areaReset"));
    });

    mainSaveBtn.addEventListener("click", () => {
      if (!originalImg) return;
      ocrRequestId++;
      editMode = false;
      editModeBtn.classList.remove("active");
      activeBox = null;
      inspectorPanel.classList.remove("show");
      renderMain(false);
      exportChoices.classList.add("show");
      showToast(t("chooseExport"));
    });

    function getFinalDataUrl() {
      renderMain(false);
      return mainCanvas.toDataURL("image/png");
    }

    copyImgBtn.addEventListener("click", async () => {
      if (!originalImg) return;
      try {
        renderMain(false);
        const blob = await new Promise((resolve) => mainCanvas.toBlob(resolve, "image/png"));
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          showToast(t("copied"));
        } else {
          showToast(t("copyUnsupported"));
        }
      } catch (err) {
        showToast(t("copyFailed"));
      }
    });

    downloadNewBtn.addEventListener("click", () => {
      if (!originalImg) return;
      const dataUrl = getFinalDataUrl();
      const stamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);
      const link = document.createElement("a");
      link.download = `edited-${stamp}.png`;
      link.href = dataUrl;
      link.click();
      showToast(t("savedNew", link.download));
    });

    applyUILanguage();
  </script>
</body>
</html>
