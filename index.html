<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Inspect & Auto-Align Text Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0f172a;
      --canvas-bg: #020617;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --input-border: #475569;
    }
    :root[data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-2: #f8fafc;
      --canvas-bg: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --input-border: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .inspect-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
    }
    .top-right-btns {
      display: flex;
      gap: 8px;
    }
    .top-pill-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .upload-box {
      background: var(--card);
      border: 1px dashed var(--input-border);
      border-radius: 12px;
      padding: 12px;
    }
    .upload-box label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="file"] {
      width: 100%;
      color: var(--text);
      font-size: 13px;
    }

    .action-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }
    .btn-save-main {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      background: #10b981;
      color: #fff;
      cursor: pointer;
    }
    .btn-save-main:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-save-main:active { transform: scale(0.99); }

    .btn-undo-top {
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .btn-undo-top:disabled { opacity: 0.4; cursor: not-allowed; }

    .export-choices {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--card);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .export-choices.show { display: grid; }
    .sub-export-btn {
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
    }
    .btn-copy { background: #8b5cf6; }
    .btn-download-new { background: #059669; }

    .canvas-wrap {
      background: var(--canvas-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .zoom-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .zoom-btn {
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .zoom-label {
      font-size: 12px;
      font-weight: 700;
      min-width: 46px;
      text-align: center;
      color: var(--text);
    }
    .zoom-note {
      font-size: 11px;
      color: var(--muted);
    }

    .canvas-scroll {
      width: 100%;
      max-height: 58vh;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      border-radius: 8px;
      padding: 4px;
    }
    #mainCanvas {
      border-radius: 8px;
      background: var(--card);
      cursor: crosshair;
      touch-action: manipulation;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .sync-box {
      display: none;
      background: var(--card);
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 12px;
      flex-direction: column;
      gap: 10px;
    }
    .sync-box.show { display: flex; }
    .sync-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sync-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
    }
    .ocr-mode-group {
      display: flex;
      gap: 4px;
    }
    .ocr-mode-btn {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--input-border);
      background: var(--card-2);
      color: var(--text);
      cursor: pointer;
    }
    .ocr-mode-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    .sync-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid #3b82f6;
      background: var(--card-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }
    .meta-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (max-width: 520px) {
      .meta-row { grid-template-columns: repeat(2, 1fr); }
    }
    .mini-lbl {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .size-stepper {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .step-btn {
      width: 30px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--card-2);
      color: var(--text);
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
    input[type="number"], input[type="color"], select {
      width: 100%;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--card-2);
      color: var(--text);
      padding: 4px 6px;
      font-size: 13px;
    }

    .small-actions {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .right-mini-btns {
      display: flex;
      gap: 8px;
    }
    .btn-mini-save {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #10b981;
      color: #fff;
      cursor: pointer;
    }
    .btn-mini-reset {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #475569;
      color: #fff;
      cursor: pointer;
    }
    .btn-mini-delete {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #dc2626;
      color: #fff;
      cursor: pointer;
    }

    .toast {
      font-size: 12px;
      color: #10b981;
      text-align: center;
      min-height: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <span class="inspect-badge" id="inspectBadge">⌖ Inspect & Auto-Align</span>
      <div class="top-right-btns">
        <button class="top-pill-btn" id="themeToggleBtn">☀️ Light</button>
        <button class="top-pill-btn" id="langToggleBtn">🌐 English</button>
      </div>
    </div>

    <div class="upload-box">
      <label id="uploadLabel">ပုံတင်ရန် (Upload Image)</label>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="action-bar">
      <button class="btn-save-main" id="mainSaveBtn" disabled>SAVE</button>
      <button class="btn-undo-top" id="undoLastBtn" disabled>↩ Undo</button>
    </div>

    <div class="export-choices" id="exportChoices">
      <button class="sub-export-btn btn-copy" id="copyImgBtn">Copy</button>
      <button class="sub-export-btn btn-download-new" id="downloadNewBtn">Save</button>
    </div>

    <div class="canvas-wrap">
      <div class="zoom-bar">
        <div class="zoom-controls">
          <button type="button" class="zoom-btn" id="zoomOutBtn">−</button>
          <span class="zoom-label" id="zoomLabel">100%</span>
          <button type="button" class="zoom-btn" id="zoomInBtn">+</button>
          <button type="button" class="zoom-btn" id="zoomResetBtn">Fit</button>
        </div>
        <span class="zoom-note" id="zoomNote">Export မှာ မူရင်းပုံအတိုင်း (100%) ထုတ်ပေးပါမည်</span>
      </div>

      <div class="canvas-scroll" id="canvasScroll">
        <canvas id="mainCanvas" width="500" height="500"></canvas>
      </div>
      <div class="hint" id="hintText">ပုံတင်ပြီး စာသားပေါ် ထိ/နှိပ်ပါ (မူလနေရာနှင့် Size အတိုင်း အော်တိုညှိပေးမည်)</div>
    </div>

    <!-- Live Sync Box -->
    <div class="sync-box" id="syncBox">
      <div class="sync-header">
        <div class="sync-title" id="syncTitle">ပြုပြင်ကွက်လပ် (မူလ ဂဏန်း/သင်္ကေတနှင့် နေရာအတိုင်း ပေါ်မည်)</div>
        <div class="ocr-mode-group">
          <button type="button" class="ocr-mode-btn active" id="modeNumSymBtn">123 / Symbol</button>
          <button type="button" class="ocr-mode-btn" id="modeAllBtn">Auto All</button>
        </div>
      </div>

      <input type="text" class="sync-input" id="syncTextInput" placeholder="မူလပါ ဂဏန်းနှင့် သင်္ကေတများ ပေါ်လာမည်..." />

      <div class="meta-row">
        <div>
          <span class="mini-lbl" id="lblOrigSize">Size</span>
          <div class="size-stepper">
            <button type="button" class="step-btn" id="sizeDecBtn">−</button>
            <input type="number" id="sizeInput" value="14" min="6" max="200" />
            <button type="button" class="step-btn" id="sizeIncBtn">+</button>
          </div>
        </div>
        <div>
          <span class="mini-lbl" id="lblWeight">စာလုံးအထူ</span>
          <select id="weightInput">
            <option value="400">Normal (400)</option>
            <option value="600">Semi-Bold (600)</option>
            <option value="700" selected>Bold (700)</option>
          </select>
        </div>
        <div>
          <span class="mini-lbl" id="lblTextColor">စာသားအရောင်</span>
          <input type="color" id="textColorInput" value="#111827" />
        </div>
        <div>
          <span class="mini-lbl" id="lblBgColor">နောက်ခံဖုံးအရောင်</span>
          <input type="color" id="bgColorInput" value="#ffffff" />
        </div>
      </div>

      <div class="small-actions">
        <button class="btn-mini-delete" id="miniDeleteBtn">Delete Edit</button>
        <div class="right-mini-btns">
          <button class="btn-mini-reset" id="miniResetBtn">Reset</button>
          <button class="btn-mini-save" id="miniSaveBtn">Save</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    const i18n = {
      my: {
        inspectBadge: "⌖ Inspect & Auto-Align",
        toLight: "☀️ Light",
        toDark: "🌙 Dark",
        toEn: "🌐 English",
        toMy: "🌐 မြန်မာ",
        uploadLabel: "ပုံတင်ရန် (Upload Image)",
        placeholderCanvas: "ပုံတစ်ပုံ ရွေးချယ်ပါ",
        hintInitial: "ပုံတင်ပြီး စာသားပေါ် ထိ/နှိပ်ပါ (မူလနေရာနှင့် Size အတိုင်း အော်တိုညှိပေးမည်)",
        hintActive: "စာကြောင်းပေါ် Tap/Click လုပ်ပြီး ပြင်ပါ — Size မခုန်အောင် ထိန်းထားပြီး +/- ဖြင့်လည်း ညှိနိုင်သည်",
        zoomNote: "Export မှာ မူရင်းပုံအတိုင်း (100%) ထုတ်ပေးပါမည်",
        syncTitle: "ပြုပြင်ကွက်လပ် (မူလ ဂဏန်း/သင်္ကေတနှင့် နေရာအတိုင်း ပေါ်မည်)",
        syncPlaceholder: "မူလပါ ဂဏန်းနှင့် သင်္ကေတများ ပေါ်လာမည်...",
        lblOrigSize: "Size",
        lblWeight: "စာလုံးအထူ",
        lblTextColor: "စာသားအရောင်",
        lblBgColor: "နောက်ခံဖုံးအရောင်",
        undoBtn: "↩ Undo",
        deleteEditBtn: "Delete Edit",
        readingOcr: "ဂဏန်းနှင့် သင်္ကေတများကို ဖတ်နေပါသည်...",
        ocrDone: "မူလစာသား ပေါ်လာပါပြီ — ပြင်ပြီး Save နှိပ်ပါ",
        confirmed: "မူလနေရာအတိုင်း အတည်ပြုပြီးပါပြီ",
        reverted: "မူရင်းစာ ပြန်ပေါ်လာပါပြီ",
        deletedEdit: "ပြင်ထားသော စာသားကို ဖျက်လိုက်ပါပြီ",
        undoneEdit: "နောက်ဆုံး ပြင်ဆင်ချက်ကို ပြန်ဖျက်လိုက်ပါပြီ",
        chooseExport: "အောက်မှ Copy သို့မဟုတ် Save ကို ရွေးပါ",
        copied: "မူရင်းပုံအတိုင်း Copy ကူးပြီးပါပြီ",
        copyUnsupported: "ဒီ Browser မှာ Copy မပံ့ပိုးပါ၊ Save ကိုနှိပ်ပါ",
        copyFailed: "Copy ကူးမရပါ၊ Save ကိုနှိပ်၍ သိမ်းပါ",
        savedNew: (name) => `မူရင်းပုံအတိုင်း (${name}) သိမ်းဆည်းပြီးပါပြီ`
      },
      en: {
        inspectBadge: "⌖ Inspect & Auto-Align",
        toLight: "☀️ Light",
        toDark: "🌙 Dark",
        toEn: "🌐 English",
        toMy: "🌐 မြန်မာ",
        uploadLabel: "Upload Image",
        placeholderCanvas: "Choose an image",
        hintInitial: "Upload an image and tap/hover text to auto-align & edit",
        hintActive: "Tap/click text to edit — size stays locked while editing; fine-tune with +/-",
        zoomNote: "Export always uses original 100% scale",
        syncTitle: "Live Sync Input (Exact digits, symbols & alignment)",
        syncPlaceholder: "Original digits & symbols appear here...",
        lblOrigSize: "Size",
        lblWeight: "Weight",
        lblTextColor: "Text Color",
        lblBgColor: "Cover Color",
        undoBtn: "↩ Undo",
        deleteEditBtn: "Delete Edit",
        readingOcr: "Reading digits & symbols...",
        ocrDone: "Text loaded — edit and tap Save to confirm",
        confirmed: "Confirmed at original position",
        reverted: "Restored original text in box",
        deletedEdit: "Deleted edited text",
        undoneEdit: "Undid last confirmed edit",
        chooseExport: "Choose Copy or Save below",
        copied: "Image copied at original resolution",
        copyUnsupported: "Copy not supported here; use Save",
        copyFailed: "Could not copy; use Save instead",
        savedNew: (name) => `Saved at original scale (${name})`
      }
    };

    let lang = "my";
    let theme = "dark";
    let ocrMode = "num_sym";
    let viewZoom = 1.0; // View-only zoom; export always uses original image resolution

    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const langToggleBtn = document.getElementById("langToggleBtn");
    const modeNumSymBtn = document.getElementById("modeNumSymBtn");
    const modeAllBtn = document.getElementById("modeAllBtn");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const zoomInBtn = document.getElementById("zoomInBtn");
    const zoomResetBtn = document.getElementById("zoomResetBtn");
    const zoomLabel = document.getElementById("zoomLabel");
    const zoomNote = document.getElementById("zoomNote");
    const fileInput = document.getElementById("fileInput");
    const mainSaveBtn = document.getElementById("mainSaveBtn");
    const undoLastBtn = document.getElementById("undoLastBtn");
    const exportChoices = document.getElementById("exportChoices");
    const copyImgBtn = document.getElementById("copyImgBtn");
    const downloadNewBtn = document.getElementById("downloadNewBtn");
    const mainCanvas = document.getElementById("mainCanvas");
    const ctx = mainCanvas.getContext("2d");
    const syncBox = document.getElementById("syncBox");
    const syncTextInput = document.getElementById("syncTextInput");
    const sizeInput = document.getElementById("sizeInput");
    const sizeDecBtn = document.getElementById("sizeDecBtn");
    const sizeIncBtn = document.getElementById("sizeIncBtn");
    const weightInput = document.getElementById("weightInput");
    const textColorInput = document.getElementById("textColorInput");
    const bgColorInput = document.getElementById("bgColorInput");
    const miniSaveBtn = document.getElementById("miniSaveBtn");
    const miniResetBtn = document.getElementById("miniResetBtn");
    const miniDeleteBtn = document.getElementById("miniDeleteBtn");
    const hintText = document.getElementById("hintText");
    const toastMsg = document.getElementById("toastMsg");

    let baseImg = null;
    let sampleCanvas = document.createElement("canvas");
    let sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

    // Dedicated export canvas so export is ALWAYS original resolution without view zoom
    let exportCanvas = document.createElement("canvas");
    let exportCtx = exportCanvas.getContext("2d");

    let confirmedEdits = [];
    let hoverBox = null;
    let liveEdit = null;
    let ocrToken = 0;

    function t(k, ...a) {
      const v = i18n[lang][k];
      return typeof v === "function" ? v(...a) : v;
    }

    function updateButtonsState() {
      undoLastBtn.disabled = confirmedEdits.length === 0;
    }

    function applyZoomDisplay() {
      zoomLabel.textContent = `${Math.round(viewZoom * 100)}%`;
      if (!baseImg) {
        mainCanvas.style.width = "100%";
        mainCanvas.style.maxWidth = "500px";
        mainCanvas.style.height = "auto";
        return;
      }
      const containerW = Math.max(240, document.getElementById("canvasScroll").clientWidth - 12);
      const fitScale = Math.min(1, containerW / baseImg.width);
      const effectiveScale = fitScale * viewZoom;
      mainCanvas.style.maxWidth = "none";
      mainCanvas.style.width = `${Math.round(baseImg.width * effectiveScale)}px`;
      mainCanvas.style.height = `${Math.round(baseImg.height * effectiveScale)}px`;
    }

    function setZoom(nextZoom) {
      viewZoom = Math.max(0.5, Math.min(3.5, Number(nextZoom.toFixed(2))));
      applyZoomDisplay();
    }

    zoomInBtn.addEventListener("click", () => setZoom(viewZoom + 0.25));
    zoomOutBtn.addEventListener("click", () => setZoom(viewZoom - 0.25));
    zoomResetBtn.addEventListener("click", () => setZoom(1.0));
    window.addEventListener("resize", applyZoomDisplay);

    function applyLang() {
      document.getElementById("inspectBadge").textContent = t("inspectBadge");
      document.getElementById("uploadLabel").textContent = t("uploadLabel");
      document.getElementById("syncTitle").textContent = t("syncTitle");
      syncTextInput.placeholder = t("syncPlaceholder");
      document.getElementById("lblOrigSize").textContent = t("lblOrigSize");
      document.getElementById("lblWeight").textContent = t("lblWeight");
      document.getElementById("lblTextColor").textContent = t("lblTextColor");
      document.getElementById("lblBgColor").textContent = t("lblBgColor");
      zoomNote.textContent = t("zoomNote");
      undoLastBtn.textContent = t("undoBtn");
      miniDeleteBtn.textContent = t("deleteEditBtn");
      themeToggleBtn.textContent = theme === "dark" ? t("toLight") : t("toDark");
      langToggleBtn.textContent = lang === "my" ? t("toEn") : t("toMy");
      hintText.textContent = baseImg ? t("hintActive") : t("hintInitial");
      render(true);
    }

    themeToggleBtn.addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      themeToggleBtn.textContent = theme === "dark" ? t("toLight") : t("toDark");
    });

    langToggleBtn.addEventListener("click", () => {
      lang = lang === "my" ? "en" : "my";
      document.documentElement.setAttribute("lang", lang);
      applyLang();
    });

    function setOcrMode(mode) {
      ocrMode = mode;
      modeNumSymBtn.classList.toggle("active", mode === "num_sym");
      modeAllBtn.classList.toggle("active", mode === "all");
      if (liveEdit && !liveEdit.isDirty) {
        const token = ++ocrToken;
        runAutoOcr({ ...liveEdit }, token);
      }
    }

    modeNumSymBtn.addEventListener("click", () => setOcrMode("num_sym"));
    modeAllBtn.addEventListener("click", () => setOcrMode("all"));

    function showToast(msg) {
      toastMsg.textContent = msg;
      setTimeout(() => {
        if (toastMsg.textContent === msg) toastMsg.textContent = "";
      }, 3000);
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
    }

    function colorDistSq(c1, c2) {
      return (c1[0] - c2[0]) ** 2 + (c1[1] - c2[1]) ** 2 + (c1[2] - c2[2]) ** 2;
    }

    // Strict single-line inspection around (cx, cy)
    function inspectLineAt(cx, cy) {
      const scaleFactor = baseImg ? Math.max(1, baseImg.width / 540) : 1;
      const defaultSize = Math.max(11, Math.round(14 * scaleFactor));
      const fallback = {
        bgColor: "#ffffff",
        textColor: "#111827",
        fontSize: defaultSize,
        fontWeight: "700",
        x: Math.max(0, Math.round(cx - 80 * scaleFactor)),
        y: Math.max(0, Math.round(cy - defaultSize * 0.65)),
        w: Math.min(mainCanvas.width, Math.round(160 * scaleFactor)),
        h: Math.round(defaultSize * 1.2)
      };
      if (!baseImg) return fallback;

      const scanW = Math.min(sampleCanvas.width, Math.max(180, Math.round(sampleCanvas.width * 0.78)));
      const maxLineSearchH = Math.max(20, Math.min(52, Math.round(sampleCanvas.height * 0.026)));
      const scanH = Math.min(sampleCanvas.height, maxLineSearchH);
      const sx0 = Math.max(0, Math.min(sampleCanvas.width - scanW, Math.round(cx - scanW * 0.35)));
      const sy0 = Math.max(0, Math.min(sampleCanvas.height - scanH, Math.round(cy - scanH / 2)));

      try {
        const imgData = sampleCtx.getImageData(sx0, sy0, scanW, scanH).data;

        const edgeColors = [];
        for (let x = 0; x < scanW; x += 2) {
          for (const y of [0, scanH - 1]) {
            const idx = (y * scanW + x) * 4;
            edgeColors.push([imgData[idx], imgData[idx + 1], imgData[idx + 2]]);
          }
        }
        edgeColors.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
        const bgRgb = edgeColors[Math.floor(edgeColors.length * 0.65)] || [255, 255, 255];

        const midY = Math.max(0, Math.min(scanH - 1, Math.round(cy - sy0)));
        let topY = midY;
        let botY = midY;

        const rowHasFg = (y) => {
          let hits = 0;
          for (let x = 0; x < scanW; x += 2) {
            const idx = (y * scanW + x) * 4;
            const px = [imgData[idx], imgData[idx + 1], imgData[idx + 2]];
            if (colorDistSq(px, bgRgb) > 3000) hits++;
          }
          return hits >= 2;
        };

        let gapUp = 0;
        for (let y = midY; y >= 0; y--) {
          if (rowHasFg(y)) { topY = y; gapUp = 0; }
          else { gapUp++; if (gapUp > 1 && y < midY - 2) break; }
        }
        let gapDn = 0;
        for (let y = midY; y < scanH; y++) {
          if (rowHasFg(y)) { botY = y; gapDn = 0; }
          else { gapDn++; if (gapDn > 1 && y > midY + 2) break; }
        }

        const linePixelH = Math.max(9, botY - topY + 1);
        const estimatedFontSize = Math.max(9, Math.min(180, Math.round(linePixelH * 0.85)));

        const colHits = new Array(scanW).fill(false);
        let fgSum = [0, 0, 0];
        let fgCount = 0;
        let activePixels = 0;

        for (let x = 0; x < scanW; x++) {
          for (let y = topY; y <= botY; y++) {
            const idx = (y * scanW + x) * 4;
            const px = [imgData[idx], imgData[idx + 1], imgData[idx + 2]];
            if (colorDistSq(px, bgRgb) > 3000) {
              colHits[x] = true;
              activePixels++;
              fgSum[0] += px[0];
              fgSum[1] += px[1];
              fgSum[2] += px[2];
              fgCount++;
            }
          }
        }

        const tapLocalX = Math.max(0, Math.min(scanW - 1, Math.round(cx - sx0)));
        let leftX = tapLocalX;
        let rightX = tapLocalX;

        let gap = 0;
        for (let x = tapLocalX; x >= 0; x--) {
          if (colHits[x]) { leftX = x; gap = 0; }
          else { gap++; if (gap > Math.max(4, Math.round(estimatedFontSize * 0.4))) break; }
        }
        gap = 0;
        for (let x = tapLocalX; x < scanW; x++) {
          if (colHits[x]) { rightX = x; gap = 0; }
          else { gap++; if (gap > Math.max(4, Math.round(estimatedFontSize * 0.4))) break; }
        }

        const padX = Math.max(2, Math.round(estimatedFontSize * 0.14));
        const padY = Math.max(1, Math.round(estimatedFontSize * 0.12));

        let x = sx0 + Math.max(0, leftX - padX);
        let w = Math.max(50, Math.min(sampleCanvas.width - x, (rightX - leftX) + padX * 2));
        if (rightX - leftX < 5) {
          x = Math.max(0, Math.min(sampleCanvas.width - 130, Math.round(cx - 35)));
          w = Math.min(sampleCanvas.width - x, 130);
        }

        const absTop = sy0 + topY;
        const absBot = sy0 + botY;
        const y = Math.max(0, absTop - padY);
        const h = Math.min(sampleCanvas.height - y, (absBot - absTop + 1) + padY * 2);

        let fgRgb = (bgRgb[0] + bgRgb[1] + bgRgb[2]) > 380 ? [15, 23, 42] : [255, 255, 255];
        if (fgCount > 3) {
          fgRgb = [fgSum[0] / fgCount, fgSum[1] / fgCount, fgSum[2] / fgCount];
        }

        const spanW = Math.max(1, rightX - leftX + 1);
        const density = activePixels / Math.max(1, spanW * linePixelH);
        const fontWeight = density > 0.36 ? "700" : (density > 0.24 ? "600" : "400");

        return {
          bgColor: rgbToHex(bgRgb[0], bgRgb[1], bgRgb[2]),
          textColor: rgbToHex(fgRgb[0], fgRgb[1], fgRgb[2]),
          fontSize: estimatedFontSize,
          fontWeight,
          x,
          y,
          w,
          h
        };
      } catch (_) {
        return fallback;
      }
    }

    function drawAutoAlignedEditOn(targetCtx, item, showOutline, isLive) {
      const boxH = Math.max(item.h, Math.round(item.fontSize * 1.2));
      const boxY = item.y;
      const textX = item.x + Math.max(2, Math.round(item.fontSize * 0.1));
      const centerY = boxY + boxH / 2;

      targetCtx.font = `${item.fontWeight || "700"} ${item.fontSize}px system-ui, -apple-system, sans-serif`;
      const textW = (item.text && item.text.length > 0) ? targetCtx.measureText(item.text).width : 0;
      const rightPad = Math.max(6, Math.round(item.fontSize * 0.28));
      const coverW = Math.min(
        targetCtx.canvas.width - item.x,
        Math.max(item.w, Math.ceil((textX - item.x) + textW + rightPad))
      );

      if (!isLive || item.isDirty) {
        targetCtx.fillStyle = item.bgColor;
        targetCtx.fillRect(item.x, boxY, coverW, boxH);

        if (item.text && item.text.length > 0) {
          targetCtx.fillStyle = item.textColor;
          targetCtx.textAlign = "left";
          targetCtx.textBaseline = "middle";
          targetCtx.fillText(item.text, textX, centerY);
          targetCtx.textBaseline = "alphabetic";
        }
      }

      if (showOutline) {
        targetCtx.save();
        targetCtx.strokeStyle = "#38bdf8";
        targetCtx.lineWidth = Math.max(1.5, targetCtx.canvas.width / 260);
        targetCtx.strokeRect(item.x, boxY, coverW, boxH);
        targetCtx.restore();
      }
    }

    function render(showOutline = true) {
      ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      if (!baseImg) {
        ctx.fillStyle = theme === "dark" ? "#94a3b8" : "#475569";
        ctx.font = "15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t("placeholderCanvas"), mainCanvas.width / 2, mainCanvas.height / 2);
        ctx.textAlign = "start";
        return;
      }

      ctx.drawImage(baseImg, 0, 0, mainCanvas.width, mainCanvas.height);

      if (showOutline && !liveEdit && hoverBox) {
        ctx.save();
        ctx.fillStyle = "rgba(56, 189, 248, 0.14)";
        ctx.fillRect(hoverBox.x, hoverBox.y, hoverBox.w, hoverBox.h);
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = Math.max(1.5, mainCanvas.width / 260);
        ctx.strokeRect(hoverBox.x, hoverBox.y, hoverBox.w, hoverBox.h);
        ctx.restore();
      }

      for (const item of confirmedEdits) {
        drawAutoAlignedEditOn(ctx, item, false, false);
      }

      if (liveEdit) {
        drawAutoAlignedEditOn(ctx, liveEdit, showOutline, true);
      }
    }

    // Builds clean original-scale export image (never affected by viewZoom or editor outlines)
    function renderCleanExportCanvas() {
      exportCanvas.width = baseImg.width;
      exportCanvas.height = baseImg.height;
      exportCtx.clearRect(0, 0, exportCanvas.width, exportCanvas.height);
      exportCtx.drawImage(baseImg, 0, 0, exportCanvas.width, exportCanvas.height);
      for (const item of confirmedEdits) {
        drawAutoAlignedEditOn(exportCtx, item, false, false);
      }
      if (liveEdit && liveEdit.isDirty) {
        drawAutoAlignedEditOn(exportCtx, liveEdit, false, false);
      }
      return exportCanvas;
    }

    function cleanOcrOutput(rawText, mode) {
      let s = (rawText || "").replace(/\s+/g, " ").trim();
      s = s.replace(/[—–−]/g, "-").replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
      if (mode === "num_sym") {
        s = s.replace(/[^\dA-Za-z\-+~,.:/()%$ ]+/g, "").replace(/\s+/g, " ").trim();
      }
      return s;
    }

    async function runAutoOcr(item, token) {
      if (!window.Tesseract || !item) return;
      const boxH = Math.max(item.h, Math.round(item.fontSize * 1.2));
      const boxY = Math.max(0, Math.round(item.y));

      const pad = 24;
      const scale = 3;
      const cropCanvas = document.createElement("canvas");
      cropCanvas.width = Math.max(240, Math.round(item.w * scale) + pad * 2);
      cropCanvas.height = Math.max(72, Math.round(boxH * scale) + pad * 2);
      const cCtx = cropCanvas.getContext("2d");
      cCtx.fillStyle = "#ffffff";
      cCtx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
      cCtx.imageSmoothingEnabled = false;
      cCtx.drawImage(
        sampleCanvas,
        Math.max(0, Math.round(item.x)),
        boxY,
        Math.max(8, Math.round(item.w)),
        Math.max(8, Math.round(boxH)),
        pad,
        pad,
        Math.round(item.w * scale),
        Math.round(boxH * scale)
      );

      showToast(t("readingOcr"));
      try {
        const langCode = ocrMode === "num_sym" ? "eng" : "eng+mya";
        const res = await Tesseract.recognize(cropCanvas.toDataURL("image/png"), langCode);
        if (token !== ocrToken || !liveEdit || liveEdit.isDirty) return;
        const detected = cleanOcrOutput(res?.data?.text || "", ocrMode);
        if (detected) {
          liveEdit.originalText = detected;
          liveEdit.text = detected;
          syncTextInput.value = detected;
          render(true);
          showToast(t("ocrDone"));
        } else {
          showToast("");
        }
      } catch (_) {
        if (token === ocrToken) showToast("");
      }
    }

    function syncInputsFromLive() {
      if (!liveEdit) return;
      syncTextInput.value = liveEdit.text;
      sizeInput.value = liveEdit.fontSize;
      weightInput.value = liveEdit.fontWeight || "700";
      textColorInput.value = liveEdit.textColor;
      bgColorInput.value = liveEdit.bgColor;
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          baseImg = img;
          mainCanvas.width = img.width;
          mainCanvas.height = img.height;

          sampleCanvas.width = img.width;
          sampleCanvas.height = img.height;
          sampleCtx.clearRect(0, 0, sampleCanvas.width, sampleCanvas.height);
          sampleCtx.drawImage(img, 0, 0);

          confirmedEdits = [];
          hoverBox = null;
          liveEdit = null;
          viewZoom = 1.0;
          applyZoomDisplay();
          syncBox.classList.remove("show");
          exportChoices.classList.remove("show");
          mainSaveBtn.disabled = false;
          updateButtonsState();
          hintText.textContent = t("hintActive");
          render(true);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    syncTextInput.addEventListener("input", () => {
      ocrToken++;
      if (!liveEdit) return;
      // Keep liveEdit.fontSize untouched when typing so size never jumps
      liveEdit.isDirty = true;
      liveEdit.text = syncTextInput.value;
      render(true);
    });

    function applySizeValue(nextVal) {
      if (!liveEdit) return;
      const clamped = Math.max(6, Math.min(200, Number(nextVal) || liveEdit.fontSize));
      sizeInput.value = clamped;
      liveEdit.fontSize = clamped;
      liveEdit.isDirty = true;
      render(true);
    }

    sizeInput.addEventListener("input", () => applySizeValue(sizeInput.value));
    sizeDecBtn.addEventListener("click", () => applySizeValue((Number(sizeInput.value) || liveEdit?.fontSize || 14) - 1));
    sizeIncBtn.addEventListener("click", () => applySizeValue((Number(sizeInput.value) || liveEdit?.fontSize || 14) + 1));

    weightInput.addEventListener("change", () => {
      if (!liveEdit) return;
      liveEdit.fontWeight = weightInput.value;
      liveEdit.isDirty = true;
      render(true);
    });

    textColorInput.addEventListener("input", () => {
      if (!liveEdit) return;
      liveEdit.textColor = textColorInput.value;
      liveEdit.isDirty = true;
      render(true);
    });

    bgColorInput.addEventListener("input", () => {
      if (!liveEdit) return;
      liveEdit.bgColor = bgColorInput.value;
      liveEdit.isDirty = true;
      render(true);
    });

    miniSaveBtn.addEventListener("click", () => {
      if (!liveEdit) return;
      ocrToken++;
      const idx = confirmedEdits.findIndex((ed) => ed.id === liveEdit.id);
      const entry = { ...liveEdit, isDirty: true };
      if (idx >= 0) confirmedEdits[idx] = entry;
      else confirmedEdits.push(entry);

      liveEdit = null;
      hoverBox = null;
      syncBox.classList.remove("show");
      updateButtonsState();
      render(true);
      showToast(t("confirmed"));
    });

    miniResetBtn.addEventListener("click", () => {
      if (!liveEdit) return;
      ocrToken++;
      liveEdit.isDirty = false;
      liveEdit.text = liveEdit.originalText || "";
      syncTextInput.value = liveEdit.text;
      render(true);
      showToast(t("reverted"));
    });

    miniDeleteBtn.addEventListener("click", () => {
      if (!liveEdit) return;
      ocrToken++;
      confirmedEdits = confirmedEdits.filter((ed) => ed.id !== liveEdit.id);
      liveEdit = null;
      hoverBox = null;
      syncBox.classList.remove("show");
      updateButtonsState();
      render(true);
      showToast(t("deletedEdit"));
    });

    undoLastBtn.addEventListener("click", () => {
      if (confirmedEdits.length === 0) return;
      confirmedEdits.pop();
      liveEdit = null;
      syncBox.classList.remove("show");
      updateButtonsState();
      render(true);
      showToast(t("undoneEdit"));
    });

    function getCoords(clientX, clientY) {
      const rect = mainCanvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * mainCanvas.width,
        y: ((clientY - rect.top) / rect.height) * mainCanvas.height
      };
    }

    function findExistingEditAt(px, py) {
      for (let i = confirmedEdits.length - 1; i >= 0; i--) {
        const ed = confirmedEdits[i];
        const boxH = Math.max(ed.h, Math.round(ed.fontSize * 1.2));
        if (px >= ed.x && px <= ed.x + ed.w && py >= ed.y && py <= ed.y + boxH) {
          return ed;
        }
      }
      return null;
    }

    mainCanvas.addEventListener("mousemove", (e) => {
      if (!baseImg || liveEdit) return;
      const pt = getCoords(e.clientX, e.clientY);
      hoverBox = inspectLineAt(pt.x, pt.y);
      render(true);
    });

    mainCanvas.addEventListener("mouseleave", () => {
      if (hoverBox) {
        hoverBox = null;
        render(true);
      }
    });

    function selectTargetAt(clientX, clientY) {
      if (!baseImg) return;
      const pt = getCoords(clientX, clientY);

      const existing = findExistingEditAt(pt.x, pt.y);
      if (existing) {
        ocrToken++;
        liveEdit = { ...existing, isDirty: true };
        syncInputsFromLive();
        syncBox.classList.add("show");
        render(true);
        return;
      }

      const info = inspectLineAt(pt.x, pt.y);
      liveEdit = {
        id: Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        x: info.x,
        y: info.y,
        w: info.w,
        h: info.h,
        text: "",
        originalText: "",
        fontSize: info.fontSize,
        fontWeight: info.fontWeight,
        textColor: info.textColor,
        bgColor: info.bgColor,
        isDirty: false
      };

      syncInputsFromLive();
      syncBox.classList.add("show");
      render(true);

      const token = ++ocrToken;
      runAutoOcr({ ...liveEdit }, token);
    }

    mainCanvas.addEventListener("click", (e) => selectTargetAt(e.clientX, e.clientY));
    mainCanvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        const pt = getCoords(e.touches[0].clientX, e.touches[0].clientY);
        hoverBox = inspectLineAt(pt.x, pt.y);
        render(true);
        selectTargetAt(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    mainSaveBtn.addEventListener("click", () => {
      if (!baseImg) return;
      if (liveEdit && liveEdit.isDirty) {
        const idx = confirmedEdits.findIndex((ed) => ed.id === liveEdit.id);
        const entry = { ...liveEdit };
        if (idx >= 0) confirmedEdits[idx] = entry;
        else confirmedEdits.push(entry);
      }
      liveEdit = null;
      hoverBox = null;
      syncBox.classList.remove("show");
      updateButtonsState();
      render(false);
      exportChoices.classList.add("show");
      showToast(t("chooseExport"));
    });

    copyImgBtn.addEventListener("click", async () => {
      if (!baseImg) return;
      try {
        const outCanvas = renderCleanExportCanvas();
        const blob = await new Promise((r) => outCanvas.toBlob(r, "image/png"));
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          showToast(t("copied"));
        } else {
          showToast(t("copyUnsupported"));
        }
      } catch (_) {
        showToast(t("copyFailed"));
      }
    });

    downloadNewBtn.addEventListener("click", () => {
      if (!baseImg) return;
      const outCanvas = renderCleanExportCanvas();
      const stamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);
      const a = document.createElement("a");
      a.download = `edited-${stamp}.png`;
      a.href = outCanvas.toDataURL("image/png");
      a.click();
      showToast(t("savedNew", a.download));
    });

    updateButtonsState();
    applyLang();
    applyZoomDisplay();
  </script>
</body>
</html>
