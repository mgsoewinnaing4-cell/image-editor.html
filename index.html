<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mobile & Desktop Image Text Editor</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    @media (min-width: 820px) {
      body { flex-direction: row; height: 100vh; overflow: hidden; }
    }

    /* Workspace (Canvas Area) */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #020617;
      min-height: 48vh;
      overflow: auto;
      position: relative;
    }
    canvas {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      background: #1e293b;
      touch-action: none; /* ဖုန်းနဲ့ဆွဲရွှေ့တဲ့အခါ Screen လိုက်မရွေ့အောင် */
    }
    .status-bar {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }

    /* Controls Sidebar / Bottom Panel */
    .sidebar {
      width: 100%;
      background: #1e293b;
      padding: 14px;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    @media (min-width: 820px) {
      .sidebar {
        width: 360px;
        border-top: none;
        border-right: 1px solid #334155;
        order: -1;
      }
    }

    .card {
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="number"], input[type="file"], select {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
      margin-bottom: 8px;
    }
    input[type="color"] {
      width: 100%;
      height: 38px;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #1e293b;
      padding: 2px;
      cursor: pointer;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      background: #3b82f6;
    }
    button:active { opacity: 0.85; }
    button.btn-patch { background: #8b5cf6; }
    button.btn-update { background: #0284c7; }
    button.btn-danger { background: #ef4444; }
    button.btn-save { background: #10b981; font-size: 15px; padding: 13px; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 8px;
      color: #e2e8f0;
    }
    .checkbox-row input { width: 16px; height: 16px; margin: 0; }
  </style>
</head>
<body>

  <main class="workspace">
    <canvas id="canvas" width="500" height="500"></canvas>
    <div class="status-bar" id="statusText">ပုံတစ်ပုံ ရွေးချယ်ပြီး စတင်ပြင်ဆင်နိုင်ပါပြီ</div>
  </main>

  <aside class="sidebar">
    <!-- 1. Upload -->
    <div class="card">
      <div class="card-title">၁။ ပုံတင်ရန် (Upload Image)</div>
      <input type="file" id="imageLoader" accept="image/*" />
    </div>

    <!-- 2. Cover / Patch Box (မူလစာသားကို ဖုံးအုပ်ရန်) -->
    <div class="card">
      <div class="card-title">၂။ မူလစာသားကို ဖုံးအုပ်ရန် (Cover Box)</div>
      <div class="grid-3">
        <div>
          <label>နောက်ခံအရောင်</label>
          <input type="color" id="patchColor" value="#ffffff" />
        </div>
        <div>
          <label>အကျယ် (W)</label>
          <input type="number" id="patchW" value="140" min="10" />
        </div>
        <div>
          <label>အမြင့် (H)</label>
          <input type="number" id="patchH" value="36" min="10" />
        </div>
      </div>
      <button class="btn-patch" id="addPatchBtn">+ ဖုံးအုပ်မည့် Box ထည့်မည်</button>
    </div>

    <!-- 3. Text Overlay (စာသားအသစ်ထည့် / ပြင်ရန်) -->
    <div class="card">
      <div class="card-title">၃။ စာသားအသစ် ထည့် / ပြင်ရန်</div>
      <input type="text" id="textValue" placeholder="စာသားရိုက်ထည့်ပါ..." />
      <div class="grid-3">
        <div>
          <label>စာလုံးဆိုဒ်</label>
          <input type="number" id="textSize" value="24" min="8" max="200" />
        </div>
        <div>
          <label>စာသားအရောင်</label>
          <input type="color" id="textColor" value="#111827" />
        </div>
        <div>
          <label>စာလုံးအထူ</label>
          <select id="textWeight">
            <option value="normal">ပုံမှန်</option>
            <option value="bold" selected>အထူ (Bold)</option>
          </select>
        </div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="textBgEnable" checked />
        <label for="textBgEnable" style="margin:0;">စာသားနောက်ခံ Box တစ်ခါတည်း ထည့်မည်</label>
      </div>
      <div class="grid-2">
        <button id="addTextBtn">+ စာသားထည့်မည်</button>
        <button class="btn-update" id="updateItemBtn">ပြင်ဆင်မည်</button>
      </div>
    </div>

    <!-- 4. Delete & Save -->
    <div class="card">
      <div class="grid-2" style="margin-bottom: 8px;">
        <button class="btn-danger" id="deleteItemBtn">ရွေးထားတာ ဖျက်မည်</button>
        <button style="background:#475569;" id="deselectBtn">Selection ဖြုတ်မည်</button>
      </div>
      <button class="btn-save" id="saveBtn">SAVE (ပုံအဖြစ် သိမ်းဆည်းမည်)</button>
    </div>
  </aside>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusText");

    let baseImage = null;
    // items: { type: 'patch'|'text', x, y, w, h, color, text, size, weight, hasBg, bgColor }
    let items = [];
    let selectedIndex = -1;
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    function drawAll(showSelection = true) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (baseImage) {
        ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#94a3b8";
        ctx.font = "16px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("ပုံတစ်ပုံ ရွေးချယ်ပါ", canvas.width / 2, canvas.height / 2);
        ctx.textAlign = "start";
      }

      items.forEach((item, index) => {
        if (item.type === "patch") {
          ctx.fillStyle = item.color;
          ctx.fillRect(item.x, item.y, item.w, item.h);

          if (showSelection && index === selectedIndex) {
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;
            ctx.strokeRect(item.x - 2, item.y - 2, item.w + 4, item.h + 4);
          }
        } else if (item.type === "text") {
          ctx.font = `${item.weight} ${item.size}px sans-serif`;
          const metrics = ctx.measureText(item.text);
          const textW = metrics.width;
          const textH = item.size;
          item.w = textW + 12;
          item.h = textH + 10;

          if (item.hasBg) {
            ctx.fillStyle = item.bgColor;
            ctx.fillRect(item.x - 6, item.y - textH + 2, item.w, item.h);
          }

          ctx.fillStyle = item.color;
          ctx.fillText(item.text, item.x, item.y);

          if (showSelection && index === selectedIndex) {
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;
            ctx.strokeRect(item.x - 8, item.y - textH, item.w + 4, item.h + 4);
          }
        }
      });
    }

    // Upload Image
    document.getElementById("imageLoader").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          baseImage = img;
          canvas.width = img.width;
          canvas.height = img.height;
          items = [];
          selectedIndex = -1;
          statusText.textContent = "ပုံတင်ပြီးပါပြီ။ Box သို့မဟုတ် စာသားထည့်ပြီး လက်/Mouse နဲ့ ဆွဲရွှေ့ပါ။";
          drawAll();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Add Cover Patch Box
    document.getElementById("addPatchBtn").addEventListener("click", () => {
      const color = document.getElementById("patchColor").value;
      const w = Number(document.getElementById("patchW").value) || 120;
      const h = Number(document.getElementById("patchH").value) || 35;

      items.push({
        type: "patch",
        x: Math.round(canvas.width / 2 - w / 2),
        y: Math.round(canvas.height / 2 - h / 2),
        w,
        h,
        color
      });
      selectedIndex = items.length - 1;
      statusText.textContent = "ဖုံးအုပ်မည့် Box ကို လိုချင်တဲ့နေရာသို့ ဆွဲရွှေ့ပါ။";
      drawAll();
    });

    // Add New Text
    document.getElementById("addTextBtn").addEventListener("click", () => {
      const text = document.getElementById("textValue").value.trim();
      if (!text) return;
      const size = Number(document.getElementById("textSize").value) || 24;
      const color = document.getElementById("textColor").value;
      const weight = document.getElementById("textWeight").value;
      const hasBg = document.getElementById("textBgEnable").checked;
      const bgColor = document.getElementById("patchColor").value;

      items.push({
        type: "text",
        text,
        x: 50,
        y: 80,
        size,
        color,
        weight,
        hasBg,
        bgColor
      });
      selectedIndex = items.length - 1;
      statusText.textContent = "စာသားကို လိုချင်တဲ့နေရာသို့ ဆွဲရွှေ့ပါ။";
      drawAll();
    });

    // Update Selected Item
    document.getElementById("updateItemBtn").addEventListener("click", () => {
      if (selectedIndex < 0) return;
      const item = items[selectedIndex];
      if (item.type === "patch") {
        item.color = document.getElementById("patchColor").value;
        item.w = Number(document.getElementById("patchW").value) || item.w;
        item.h = Number(document.getElementById("patchH").value) || item.h;
      } else if (item.type === "text") {
        const val = document.getElementById("textValue").value.trim();
        if (val) item.text = val;
        item.size = Number(document.getElementById("textSize").value) || item.size;
        item.color = document.getElementById("textColor").value;
        item.weight = document.getElementById("textWeight").value;
        item.hasBg = document.getElementById("textBgEnable").checked;
        item.bgColor = document.getElementById("patchColor").value;
      }
      drawAll();
    });

    // Delete & Deselect
    document.getElementById("deleteItemBtn").addEventListener("click", () => {
      if (selectedIndex < 0) return;
      items.splice(selectedIndex, 1);
      selectedIndex = -1;
      drawAll();
    });

    document.getElementById("deselectBtn").addEventListener("click", () => {
      selectedIndex = -1;
      drawAll();
    });

    // Pointer Coordinates Helper (Supports both Touch & Mouse)
    function getCanvasCoords(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function handleStart(clientX, clientY) {
      const pos = getCanvasCoords(clientX, clientY);
      selectedIndex = -1;

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        const hitX = it.type === "text" ? it.x - 8 : it.x;
        const hitY = it.type === "text" ? it.y - it.size : it.y;
        const hitW = it.w || 100;
        const hitH = it.h || 30;

        if (pos.x >= hitX && pos.x <= hitX + hitW && pos.y >= hitY && pos.y <= hitY + hitH) {
          selectedIndex = i;
          isDragging = true;
          offsetX = pos.x - it.x;
          offsetY = pos.y - it.y;

          if (it.type === "patch") {
            document.getElementById("patchColor").value = it.color;
            document.getElementById("patchW").value = it.w;
            document.getElementById("patchH").value = it.h;
          } else if (it.type === "text") {
            document.getElementById("textValue").value = it.text;
            document.getElementById("textSize").value = it.size;
            document.getElementById("textColor").value = it.color;
            document.getElementById("textWeight").value = it.weight;
            document.getElementById("textBgEnable").checked = it.hasBg;
          }
          break;
        }
      }
      drawAll();
    }

    function handleMove(clientX, clientY) {
      if (!isDragging || selectedIndex < 0) return;
      const pos = getCanvasCoords(clientX, clientY);
      items[selectedIndex].x = pos.x - offsetX;
      items[selectedIndex].y = pos.y - offsetY;
      drawAll();
    }

    function handleEnd() {
      isDragging = false;
    }

    // Mouse Events
    canvas.addEventListener("mousedown", (e) => handleStart(e.clientX, e.clientY));
    window.addEventListener("mousemove", (e) => handleMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", handleEnd);

    // Touch Events (Mobile)
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        handleStart(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && isDragging) {
        e.preventDefault();
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    canvas.addEventListener("touchend", handleEnd);

    // Save Final Image (without selection border)
    document.getElementById("saveBtn").addEventListener("click", () => {
      drawAll(false); // ဘောင်အပြာရောင် ဖျောက်ပြီး ပြန်ဆွဲမည်
      const link = document.createElement("a");
      link.download = "edited-result.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      drawAll(true);
      statusText.textContent = "ပုံကို Save လုပ်ပြီးပါပြီ (edited-result.png)";
    });

    drawAll();
  </script>
</body>
</html>
