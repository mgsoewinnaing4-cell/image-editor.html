<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Inspect & Auto-Align Text Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0f172a;
      --canvas-bg: #020617;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --input-border: #475569;
    }
    :root[data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-2: #f8fafc;
      --canvas-bg: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --input-border: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .app {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .inspect-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
    }
    .top-right-btns {
      display: flex;
      gap: 8px;
    }
    .top-pill-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .upload-box {
      background: var(--card);
      border: 1px dashed var(--input-border);
      border-radius: 12px;
      padding: 12px;
    }
    .upload-box label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="file"] {
      width: 100%;
      color: var(--text);
      font-size: 13px;
    }

    .btn-save-main {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      background: #10b981;
      color: #fff;
      cursor: pointer;
    }
    .btn-save-main:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-save-main:active { transform: scale(0.99); }

    .export-choices {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--card);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .export-choices.show { display: grid; }
    .sub-export-btn {
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
    }
    .btn-copy { background: #8b5cf6; }
    .btn-download-new { background: #059669; }

    .canvas-wrap {
      background: var(--canvas-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #mainCanvas {
      max-width: 100%;
      max-height: 55vh;
      border-radius: 8px;
      background: var(--card);
      cursor: crosshair;
      touch-action: manipulation;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .sync-box {
      display: none;
      background: var(--card);
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 12px;
      flex-direction: column;
      gap: 10px;
    }
    .sync-box.show { display: flex; }
    .sync-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
    }
    .sync-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid #3b82f6;
      background: var(--card-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }
    .meta-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .mini-lbl {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }
    input[type="number"], input[type="color"] {
      width: 100%;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--card-2);
      color: var(--text);
      padding: 4px;
    }

    .small-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btn-mini-save {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #10b981;
      color: #fff;
      cursor: pointer;
    }
    .btn-mini-reset {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #475569;
      color: #fff;
      cursor: pointer;
    }

    .toast {
      font-size: 12px;
      color: #10b981;
      text-align: center;
      min-height: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <span class="inspect-badge" id="inspectBadge">⌖ Inspect & Auto-Align</span>
      <div class="top-right-btns">
        <button class="top-pill-btn" id="themeToggleBtn">☀️ Light</button>
        <button class="top-pill-btn" id="langToggleBtn">🌐 English</button>
      </div>
    </div>

    <div class="upload-box">
      <label id="uploadLabel">ပုံတင်ရန် (Upload Image)</label>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <button class="btn-save-main" id="mainSaveBtn" disabled>SAVE</button>

    <div class="export-choices" id="exportChoices">
      <button class="sub-export-btn btn-copy" id="copyImgBtn">Copy</button>
      <button class="sub-export-btn btn-download-new" id="downloadNewBtn">Save</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="mainCanvas" width="500" height="500"></canvas>
      <div class="hint" id="hintText">ပုံတင်ပြီး စာသားပေါ် ထိ/နှိပ်ပါ (နေရာအော်တိုညှိပြီး ပြောင်းပေးပါမည်)</div>
    </div>

    <!-- Live Sync Box -->
    <div class="sync-box" id="syncBox">
      <div class="sync-title" id="syncTitle">တိုက်ရိုက် ချိတ်ဆက်ပြင်ဆင်ရန် ကွက်လပ် (နေရာအော်တိုညှိမည်)</div>

      <input type="text" class="sync-input" id="syncTextInput" placeholder="နှိပ်လိုက်သော စာသား အော်တိုပေါ်လာမည်..." />

      <div class="meta-row">
        <div>
          <span class="mini-lbl" id="lblOrigSize">Size (Default 20)</span>
          <input type="number" id="sizeInput" value="20" min="8" max="200" />
        </div>
        <div>
          <span class="mini-lbl" id="lblTextColor">စာသားအရောင်</span>
          <input type="color" id="textColorInput" value="#111827" />
        </div>
        <div>
          <span class="mini-lbl" id="lblBgColor">နောက်ခံဖုံးအရောင်</span>
          <input type="color" id="bgColorInput" value="#ffffff" />
        </div>
      </div>

      <div class="small-actions">
        <button class="btn-mini-save" id="miniSaveBtn">Save</button>
        <button class="btn-mini-reset" id="miniResetBtn">Reset</button>
      </div>
    </div>

    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    const i18n = {
      my: {
        inspectBadge: "⌖ Inspect & Auto-Align",
        toLight: "☀️ Light",
        toDark: "🌙 Dark",
        toEn: "🌐 English",
        toMy: "🌐 မြန်မာ",
        uploadLabel: "ပုံတင်ရန် (Upload Image)",
        placeholderCanvas: "ပုံတစ်ပုံ ရွေးချယ်ပါ",
        hintInitial: "ပုံတင်ပြီး စာသားပေါ် ထိ/နှိပ်ပါ (နေရာအော်တိုညှိပြီး ပြောင်းပေးပါမည်)",
        hintActive: "စာကြောင်းပေါ် Hover / Tap လုပ်ပြီး နှိပ်ပါ — နေရာကို အော်တိုညှိပြီး တိုက်ရိုက်ပြောင်းပေးမည်",
        syncTitle: "တိုက်ရိုက် ချိတ်ဆက်ပြင်ဆင်ရန် ကွက်လပ် (နေရာအော်တိုညှိမည်)",
        syncPlaceholder: "နှိပ်လိုက်သော စာသား အော်တိုပေါ်လာမည်...",
        lblOrigSize: "Size (Default 20)",
        lblTextColor: "စာသားအရောင်",
        lblBgColor: "နောက်ခံဖုံးအရောင်",
        readingOcr: "စာကြောင်းကို ဖတ်နေပါသည်...",
        ocrDone: "စာပေါ်လာပါပြီ — ရိုက်/ပြင်ပြီး Save နှိပ်၍ အတည်ပြုပါ",
        confirmed: "ပုံပေါ်တွင် အတည်ပြုပြီးပါပြီ",
        reverted: "မူရင်းစာ ပြန်ပေါ်လာပါပြီ",
        chooseExport: "အောက်မှ Copy သို့မဟုတ် Save ကို ရွေးပါ",
        copied: "ပုံကို Copy ကူးပြီးပါပြီ",
        copyUnsupported: "ဒီ Browser မှာ Copy မပံ့ပိုးပါ၊ Save ကိုနှိပ်ပါ",
        copyFailed: "Copy ကူးမရပါ၊ Save ကိုနှိပ်၍ သိမ်းပါ",
        savedNew: (name) => `ပုံအသစ် (${name}) သိမ်းဆည်းပြီးပါပြီ`
      },
      en: {
        inspectBadge: "⌖ Inspect & Auto-Align",
        toLight: "☀️ Light",
        toDark: "🌙 Dark",
        toEn: "🌐 English",
        toMy: "🌐 မြန်မာ",
        uploadLabel: "Upload Image",
        placeholderCanvas: "Choose an image",
        hintInitial: "Upload an image and tap/hover text to auto-align & edit",
        hintActive: "Hover/tap a text line and click to lock — auto-aligns position live",
        syncTitle: "Live Sync Input (Auto-aligns to original position)",
        syncPlaceholder: "Tapped text auto-appears here...",
        lblOrigSize: "Size (Default 20)",
        lblTextColor: "Text Color",
        lblBgColor: "Cover Color",
        readingOcr: "Reading text line...",
        ocrDone: "Text loaded — edit and tap Save to confirm",
        confirmed: "Confirmed on the image",
        reverted: "Restored original text in box",
        chooseExport: "Choose Copy or Save below",
        copied: "Image copied to clipboard",
        copyUnsupported: "Copy not supported here; use Save",
        copyFailed: "Could not copy; use Save instead",
        savedNew: (name) => `Saved new image (${name})`
      }
    };

    let lang = "my";
    let theme = "dark";

    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const langToggleBtn = document.getElementById("langToggleBtn");
    const fileInput = document.getElementById("fileInput");
    const mainSaveBtn = document.getElementById("mainSaveBtn");
    const exportChoices = document.getElementById("exportChoices");
    const copyImgBtn = document.getElementById("copyImgBtn");
    const downloadNewBtn = document.getElementById("downloadNewBtn");
    const mainCanvas = document.getElementById("mainCanvas");
    const ctx = mainCanvas.getContext("2d");
    const syncBox = document.getElementById("syncBox");
    const syncTextInput = document.getElementById("syncTextInput");
    const sizeInput = document.getElementById("sizeInput");
    const textColorInput = document.getElementById("textColorInput");
    const bgColorInput = document.getElementById("bgColorInput");
    const miniSaveBtn = document.getElementById("miniSaveBtn");
    const miniResetBtn = document.getElementById("miniResetBtn");
    const hintText = document.getElementById("hintText");
    const toastMsg = document.getElementById("toastMsg");

    let baseImg = null;
    let sampleCanvas = document.createElement("canvas");
    let sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

    let confirmedEdits = [];
    let hoverBox = null; // { x, y, w, h, textColor, bgColor, fontSize }
    let liveEdit = null; // { x, y, w, h, centerX, centerY, text, originalText, fontSize, textColor, bgColor, isDirty }
    let ocrToken = 0;

    function t(k, ...a) {
      const v = i18n[lang][k];
      return typeof v === "function" ? v(...a) : v;
    }

    function applyLang() {
      document.getElementById("inspectBadge").textContent = t("inspectBadge");
      document.getElementById("uploadLabel").textContent = t("uploadLabel");
      document.getElementById("syncTitle").textContent = t("syncTitle");
      syncTextInput.placeholder = t("syncPlaceholder");
      document.getElementById("lblOrigSize").textContent = t("lblOrigSize");
      document.getElementById("lblTextColor").textContent = t("lblTextColor");
      document.getElementById("lblBgColor").textContent = t("lblBgColor");
      themeToggleBtn.textContent = theme === "dark" ? t("toLight") : t("toDark");
      langToggleBtn.textContent = lang === "my" ? t("toEn") : t("toMy");
      hintText.textContent = baseImg ? t("hintActive") : t("hintInitial");
      render(true);
    }

    themeToggleBtn.addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      themeToggleBtn.textContent = theme === "dark" ? t("toLight") : t("toDark");
    });

    langToggleBtn.addEventListener("click", () => {
      lang = lang === "my" ? "en" : "my";
      document.documentElement.setAttribute("lang", lang);
      applyLang();
    });

    function showToast(msg) {
      toastMsg.textContent = msg;
      setTimeout(() => {
        if (toastMsg.textContent === msg) toastMsg.textContent = "";
      }, 3000);
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
    }

    function colorDistSq(c1, c2) {
      return (c1[0] - c2[0]) ** 2 + (c1[1] - c2[1]) ** 2 + (c1[2] - c2[2]) ** 2;
    }

    // Inspect target line/group around (cx, cy) like F12 Inspect highlight
    function inspectLineAt(cx, cy) {
      const defaultSize = 20;
      const fallback = {
        bgColor: "#ffffff",
        textColor: "#111827",
        fontSize: defaultSize,
        x: Math.max(0, Math.round(cx - 90)),
        y: Math.max(0, Math.round(cy - 14)),
        w: Math.min(mainCanvas.width, 180),
        h: Math.round(defaultSize * 1.4)
      };
      if (!baseImg) return fallback;

      const scanW = Math.min(sampleCanvas.width, Math.max(180, Math.round(sampleCanvas.width * 0.72)));
      const scanH = Math.min(sampleCanvas.height, Math.max(24, Math.round(sampleCanvas.height * 0.036)));
      const sx0 = Math.max(0, Math.min(sampleCanvas.width - scanW, Math.round(cx - scanW / 2)));
      const sy0 = Math.max(0, Math.min(sampleCanvas.height - scanH, Math.round(cy - scanH / 2)));

      try {
        const imgData = sampleCtx.getImageData(sx0, sy0, scanW, scanH).data;
        const borderColors = [];
        for (let x = 0; x < scanW; x += 3) {
          for (const y of [0, scanH - 1]) {
            const idx = (y * scanW + x) * 4;
            borderColors.push([imgData[idx], imgData[idx + 1], imgData[idx + 2]]);
          }
        }
        for (let y = 0; y < scanH; y += 2) {
          for (const x of [0, scanW - 1]) {
            const idx = (y * scanW + x) * 4;
            borderColors.push([imgData[idx], imgData[idx + 1], imgData[idx + 2]]);
          }
        }
        borderColors.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
        const bgRgb = borderColors[Math.floor(borderColors.length / 2)] || [255, 255, 255];

        const midY = Math.floor(scanH / 2);
        const halfBand = Math.max(4, Math.floor(scanH * 0.36));
        const colHits = new Array(scanW).fill(false);
        let fgSum = [0, 0, 0];
        let fgCount = 0;

        for (let x = 0; x < scanW; x++) {
          for (let y = Math.max(0, midY - halfBand); y <= Math.min(scanH - 1, midY + halfBand); y++) {
            const idx = (y * scanW + x) * 4;
            const px = [imgData[idx], imgData[idx + 1], imgData[idx + 2]];
            if (colorDistSq(px, bgRgb) > 2500) {
              colHits[x] = true;
              fgSum[0] += px[0];
              fgSum[1] += px[1];
              fgSum[2] += px[2];
              fgCount++;
            }
          }
        }

        const tapLocalX = Math.max(0, Math.min(scanW - 1, Math.round(cx - sx0)));
        let leftX = tapLocalX;
        let rightX = tapLocalX;

        let gap = 0;
        for (let x = tapLocalX; x >= 0; x--) {
          if (colHits[x]) {
            leftX = x;
            gap = 0;
          } else {
            gap++;
            if (gap > 6) break;
          }
        }
        gap = 0;
        for (let x = tapLocalX; x < scanW; x++) {
          if (colHits[x]) {
            rightX = x;
            gap = 0;
          } else {
            gap++;
            if (gap > 6) break;
          }
        }

        let x = sx0 + Math.max(0, leftX - 4);
        let w = Math.max(80, Math.min(sampleCanvas.width - x, (rightX - leftX) + 12));
        if (rightX - leftX < 8) {
          x = Math.max(0, Math.min(sampleCanvas.width - 150, Math.round(cx - 75)));
          w = Math.min(sampleCanvas.width - x, 150);
        }

        const h = Math.max(24, Math.round(defaultSize * 1.4));
        const y = Math.max(0, Math.min(sampleCanvas.height - h, Math.round(cy - h / 2)));

        let fgRgb = bgRgb[0] + bgRgb[1] + bgRgb[2] > 380 ? [15, 23, 42] : [255, 255, 255];
        if (fgCount > 4) {
          fgRgb = [fgSum[0] / fgCount, fgSum[1] / fgCount, fgSum[2] / fgCount];
        }

        return {
          bgColor: rgbToHex(bgRgb[0], bgRgb[1], bgRgb[2]),
          textColor: rgbToHex(fgRgb[0], fgRgb[1], fgRgb[2]),
          fontSize: defaultSize,
          x,
          y,
          w,
          h
        };
      } catch (_) {
        return fallback;
      }
    }

    // Auto-aligns cover & new text automatically to original center/baseline without manual positioning
    function drawAutoAlignedEdit(item, showOutline, isLive) {
      const boxH = Math.max(item.h, Math.round(item.fontSize * 1.35));
      const boxY = item.y;

      if (!isLive || item.isDirty) {
        ctx.fillStyle = item.bgColor;
        ctx.fillRect(item.x, boxY, item.w, boxH);

        if (item.text && item.text.length > 0) {
          ctx.font = `${item.fontSize}px sans-serif`;
          const measuredW = ctx.measureText(item.text).width;
          // Auto-align horizontally centered within original slot (or left-aligned if wider than slot)
          const alignedX = measuredW < item.w - 6
            ? Math.round(item.centerX - measuredW / 2)
            : item.x + 2;

          ctx.fillStyle = item.textColor;
          ctx.textBaseline = "middle";
          ctx.fillText(item.text, alignedX, boxY + boxH / 2);
          ctx.textBaseline = "alphabetic";
        }
      }

      if (showOutline) {
        ctx.save();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = Math.max(1.5, mainCanvas.width / 260);
        ctx.strokeRect(item.x, boxY, item.w, boxH);
        ctx.restore();
      }
    }

    function render(showOutline = true) {
      ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      if (!baseImg) {
        ctx.fillStyle = theme === "dark" ? "#94a3b8" : "#475569";
        ctx.font = "15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t("placeholderCanvas"), mainCanvas.width / 2, mainCanvas.height / 2);
        ctx.textAlign = "start";
        return;
      }

      ctx.drawImage(baseImg, 0, 0, mainCanvas.width, mainCanvas.height);

      // F12-style inspect highlight on hover/touch before locking
      if (showOutline && !liveEdit && hoverBox) {
        ctx.save();
        ctx.fillStyle = "rgba(56, 189, 248, 0.14)";
        ctx.fillRect(hoverBox.x, hoverBox.y, hoverBox.w, hoverBox.h);
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = Math.max(1.5, mainCanvas.width / 260);
        ctx.strokeRect(hoverBox.x, hoverBox.y, hoverBox.w, hoverBox.h);
        ctx.restore();
      }

      for (const item of confirmedEdits) {
        drawAutoAlignedEdit(item, false, false);
      }

      if (liveEdit) {
        drawAutoAlignedEdit(liveEdit, showOutline, true);
      }
    }

    async function runAutoOcr(item, token) {
      if (!window.Tesseract || !item) return;
      const boxH = Math.max(item.h, Math.round(item.fontSize * 1.35));
      const boxY = Math.max(0, Math.round(item.y));

      const cropCanvas = document.createElement("canvas");
      cropCanvas.width = Math.max(120, Math.round(item.w * 2));
      cropCanvas.height = Math.max(40, Math.round(boxH * 2));
      const cCtx = cropCanvas.getContext("2d");
      cCtx.fillStyle = "#ffffff";
      cCtx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
      cCtx.drawImage(
        sampleCanvas,
        Math.max(0, Math.round(item.x)),
        boxY,
        Math.max(10, Math.round(item.w)),
        Math.max(10, Math.round(boxH)),
        0,
        0,
        cropCanvas.width,
        cropCanvas.height
      );

      showToast(t("readingOcr"));
      try {
        const res = await Tesseract.recognize(cropCanvas.toDataURL("image/png"), "eng+mya");
        if (token !== ocrToken || !liveEdit || liveEdit.isDirty) return;
        const detected = (res?.data?.text || "").replace(/\s+/g, " ").trim();
        if (detected) {
          liveEdit.originalText = detected;
          liveEdit.text = detected;
          syncTextInput.value = detected;
          render(true);
          showToast(t("ocrDone"));
        } else {
          showToast("");
        }
      } catch (_) {
        if (token === ocrToken) showToast("");
      }
    }

    function syncInputsFromLive() {
      if (!liveEdit) return;
      syncTextInput.value = liveEdit.text;
      sizeInput.value = liveEdit.fontSize;
      textColorInput.value = liveEdit.textColor;
      bgColorInput.value = liveEdit.bgColor;
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          baseImg = img;
          mainCanvas.width = img.width;
          mainCanvas.height = img.height;

          sampleCanvas.width = img.width;
          sampleCanvas.height = img.height;
          sampleCtx.clearRect(0, 0, sampleCanvas.width, sampleCanvas.height);
          sampleCtx.drawImage(img, 0, 0);

          confirmedEdits = [];
          hoverBox = null;
          liveEdit = null;
          syncBox.classList.remove("show");
          exportChoices.classList.remove("show");
          mainSaveBtn.disabled = false;
          hintText.textContent = t("hintActive");
          render(true);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    syncTextInput.addEventListener("input", () => {
      ocrToken++;
      if (!liveEdit) return;
      liveEdit.isDirty = true;
      liveEdit.text = syncTextInput.value;
      render(true);
    });

    sizeInput.addEventListener("input", () => {
      if (!liveEdit) return;
      const sz = Number(sizeInput.value) || 20;
      liveEdit.fontSize = sz;
      liveEdit.h = Math.max(liveEdit.h, Math.round(sz * 1.35));
      liveEdit.isDirty = true;
      render(true);
    });

    textColorInput.addEventListener("input", () => {
      if (!liveEdit) return;
      liveEdit.textColor = textColorInput.value;
      liveEdit.isDirty = true;
      render(true);
    });

    bgColorInput.addEventListener("input", () => {
      if (!liveEdit) return;
      liveEdit.bgColor = bgColorInput.value;
      liveEdit.isDirty = true;
      render(true);
    });

    miniSaveBtn.addEventListener("click", () => {
      if (!liveEdit) return;
      ocrToken++;
      confirmedEdits.push({ ...liveEdit, isDirty: true });
      liveEdit = null;
      hoverBox = null;
      syncBox.classList.remove("show");
      render(true);
      showToast(t("confirmed"));
    });

    miniResetBtn.addEventListener("click", () => {
      if (!liveEdit) return;
      ocrToken++;
      liveEdit.isDirty = false;
      liveEdit.text = liveEdit.originalText || "";
      syncTextInput.value = liveEdit.text;
      render(true);
      showToast(t("reverted"));
    });

    function getCoords(clientX, clientY) {
      const rect = mainCanvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * mainCanvas.width,
        y: ((clientY - rect.top) / rect.height) * mainCanvas.height
      };
    }

    // Hover inspect highlight on desktop mouse move
    mainCanvas.addEventListener("mousemove", (e) => {
      if (!baseImg || liveEdit) return;
      const pt = getCoords(e.clientX, e.clientY);
      hoverBox = inspectLineAt(pt.x, pt.y);
      render(true);
    });

    mainCanvas.addEventListener("mouseleave", () => {
      if (hoverBox) {
        hoverBox = null;
        render(true);
      }
    });

    // Click / Tap to inspect and lock onto text line (auto-aligns position)
    function selectTargetAt(clientX, clientY) {
      if (!baseImg) return;
      const pt = getCoords(clientX, clientY);
      const info = inspectLineAt(pt.x, pt.y);

      liveEdit = {
        x: info.x,
        y: info.y,
        w: info.w,
        h: info.h,
        centerX: info.x + info.w / 2,
        centerY: info.y + info.h / 2,
        text: "",
        originalText: "",
        fontSize: info.fontSize,
        textColor: info.textColor,
        bgColor: info.bgColor,
        isDirty: false
      };

      syncInputsFromLive();
      syncBox.classList.add("show");
      render(true);

      const token = ++ocrToken;
      runAutoOcr({ ...liveEdit }, token);
    }

    mainCanvas.addEventListener("click", (e) => selectTargetAt(e.clientX, e.clientY));
    mainCanvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        const pt = getCoords(e.touches[0].clientX, e.touches[0].clientY);
        hoverBox = inspectLineAt(pt.x, pt.y);
        render(true);
        selectTargetAt(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    mainSaveBtn.addEventListener("click", () => {
      if (!baseImg) return;
      if (liveEdit && liveEdit.isDirty) {
        confirmedEdits.push({ ...liveEdit });
      }
      liveEdit = null;
      hoverBox = null;
      syncBox.classList.remove("show");
      render(false);
      exportChoices.classList.add("show");
      showToast(t("chooseExport"));
    });

    copyImgBtn.addEventListener("click", async () => {
      if (!baseImg) return;
      try {
        render(false);
        const blob = await new Promise((r) => mainCanvas.toBlob(r, "image/png"));
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          showToast(t("copied"));
        } else {
          showToast(t("copyUnsupported"));
        }
      } catch (_) {
        showToast(t("copyFailed"));
      }
    });

    downloadNewBtn.addEventListener("click", () => {
      if (!baseImg) return;
      render(false);
      const stamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);
      const a = document.createElement("a");
      a.download = `edited-${stamp}.png`;
      a.href = mainCanvas.toDataURL("image/png");
      a.click();
      showToast(t("savedNew", a.download));
    });

    applyLang();
  </script>
</body>
</html>
