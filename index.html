<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Image Text Sync Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0f172a;
      --canvas-bg: #020617;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --input-border: #475569;
    }
    :root[data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-2: #f8fafc;
      --canvas-bg: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --input-border: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .app {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .top-pill-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .upload-box {
      background: var(--card);
      border: 1px dashed var(--input-border);
      border-radius: 12px;
      padding: 12px;
    }
    .upload-box label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="file"] {
      width: 100%;
      color: var(--text);
      font-size: 13px;
    }

    .btn-save-main {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      background: #10b981;
      color: #fff;
      cursor: pointer;
    }
    .btn-save-main:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-save-main:active { transform: scale(0.99); }

    .export-choices {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--card);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .export-choices.show { display: grid; }
    .sub-export-btn {
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
    }
    .btn-copy { background: #8b5cf6; }
    .btn-download-new { background: #059669; }

    .canvas-wrap {
      background: var(--canvas-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #mainCanvas {
      max-width: 100%;
      max-height: 55vh;
      border-radius: 8px;
      background: var(--card);
      touch-action: none;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .sync-box {
      display: none;
      background: var(--card);
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 12px;
      flex-direction: column;
      gap: 10px;
    }
    .sync-box.show { display: flex; }
    .sync-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
    }
    .sync-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid #3b82f6;
      background: var(--card-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }
    .meta-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .mini-lbl {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }
    input[type="number"], input[type="color"] {
      width: 100%;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--card-2);
      color: var(--text);
      padding: 4px;
    }

    /* Small Save & Reset buttons below edit box */
    .small-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btn-mini-save {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #10b981;
      color: #fff;
      cursor: pointer;
    }
    .btn-mini-reset {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #475569;
      color: #fff;
      cursor: pointer;
    }
    .btn-mini-save:active, .btn-mini-reset:active { opacity: 0.85; }

    .toast {
      font-size: 12px;
      color: #10b981;
      text-align: center;
      min-height: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <button class="top-pill-btn" id="themeToggleBtn">☀️ Light</button>
      <button class="top-pill-btn" id="langToggleBtn">🌐 English</button>
    </div>

    <div class="upload-box">
      <label id="uploadLabel">ပုံတင်ရန် (Upload Image)</label>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <button class="btn-save-main" id="mainSaveBtn" disabled>SAVE</button>

    <div class="export-choices" id="exportChoices">
      <button class="sub-export-btn btn-copy" id="copyImgBtn">Copy</button>
      <button class="sub-export-btn btn-download-new" id="downloadNewBtn">Save</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="mainCanvas" width="500" height="500"></canvas>
      <div class="hint" id="hintText">ပုံတင်ပြီး ပုံပေါ်က ပြင်ချင်တဲ့ စာသားနေရာကို နှိပ်ပါ</div>
    </div>

    <!-- Live Sync Box -->
    <div class="sync-box" id="syncBox">
      <div class="sync-title" id="syncTitle">တိုက်ရိုက် ချိတ်ဆက်ပြင်ဆင်ရန် ကွက်လပ် (ဖျက်ရင်ပျက်၊ ရိုက်ရင်လိုက်ရိုက်မည်)</div>

      <input type="text" class="sync-input" id="syncTextInput" placeholder="နှိပ်လိုက်သော စာသား အော်တိုပေါ်လာမည်..." />

      <div class="meta-row">
        <div>
          <span class="mini-lbl" id="lblOrigSize">မူရင်း Size (px)</span>
          <input type="number" id="sizeInput" value="16" min="8" max="200" />
        </div>
        <div>
          <span class="mini-lbl" id="lblTextColor">စာသားအရောင်</span>
          <input type="color" id="textColorInput" value="#111827" />
        </div>
        <div>
          <span class="mini-lbl" id="lblBgColor">နောက်ခံဖုံးအရောင်</span>
          <input type="color" id="bgColorInput" value="#ffffff" />
        </div>
      </div>

      <div class="small-actions">
        <button class="btn-mini-save" id="miniSaveBtn">Save</button>
        <button class="btn-mini-reset" id="miniResetBtn">Reset</button>
      </div>
    </div>

    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    const i18n = {
      my: {
        toLight: "☀️ Light",
        toDark: "🌙 Dark",
        toEn: "🌐 English",
        toMy: "🌐 မြန်မာ",
        uploadLabel: "ပုံတင်ရန် (Upload Image)",
        placeholderCanvas: "ပုံတစ်ပုံ ရွေးချယ်ပါ",
        hintInitial: "ပုံတင်ပြီး ပုံပေါ်က ပြင်ချင်တဲ့ စာသားနေရာကို နှိပ်ပါ",
        hintActive: "စာနေရာကို နှိပ်ပါ — အောက်ကွက်မှာ စာဖျက်ရင်ပုံမှာလိုက်ပျက်ပြီး ရိုက်ရင်လိုက်ရိုက်မည်",
        syncTitle: "တိုက်ရိုက် ချိတ်ဆက်ပြင်ဆင်ရန် ကွက်လပ် (ဖျက်ရင်ပျက်၊ ရိုက်ရင်လိုက်ရိုက်မည်)",
        syncPlaceholder: "နှိပ်လိုက်သော စာသား အော်တိုပေါ်လာမည်...",
        lblOrigSize: "မူရင်း Size (px)",
        lblTextColor: "စာသားအရောင်",
        lblBgColor: "နောက်ခံဖုံးအရောင်",
        readingOcr: "နှိပ်လိုက်သော နေရာမှ စာသားကို အော်တိုဖတ်နေပါသည်...",
        ocrDone: "စာသားပေါ်လာပါပြီ — ပြင်ပြီး Save နှိပ်၍ အတည်ပြုပါ",
        confirmed: "ပုံပေါ်တွင် အတည်ပြုပြီးပါပြီ",
        reverted: "မူရင်းစာ ပြန်ပေါ်လာပါပြီ",
        chooseExport: "အောက်မှ Copy သို့မဟုတ် Save ကို ရွေးပါ",
        copied: "ပုံကို Copy ကူးပြီးပါပြီ",
        copyUnsupported: "ဒီ Browser မှာ Copy မပံ့ပိုးပါ၊ Save ကိုနှိပ်ပါ",
        copyFailed: "Copy ကူးမရပါ၊ Save ကိုနှိပ်၍ သိမ်းပါ",
        savedNew: (name) => `ပုံအသစ် (${name}) သိမ်းဆည်းပြီးပါပြီ`
      },
      en: {
        toLight: "☀️ Light",
        toDark: "🌙 Dark",
        toEn: "🌐 English",
        toMy: "🌐 မြန်မာ",
        uploadLabel: "Upload Image",
        placeholderCanvas: "Choose an image",
        hintInitial: "Upload an image and tap a text area on the image",
        hintActive: "Tap text on image — erasing or typing below updates the image live",
        syncTitle: "Live Sync Input (Erase or type to sync directly with image)",
        syncPlaceholder: "Tapped text auto-appears here...",
        lblOrigSize: "Original Size (px)",
        lblTextColor: "Text Color",
        lblBgColor: "Cover Color",
        readingOcr: "Auto-detecting text from tapped area...",
        ocrDone: "Text loaded — edit and tap Save to confirm",
        confirmed: "Confirmed on the image",
        reverted: "Restored original text in box",
        chooseExport: "Choose Copy or Save below",
        copied: "Image copied to clipboard",
        copyUnsupported: "Copy not supported here; use Save",
        copyFailed: "Could not copy; use Save instead",
        savedNew: (name) => `Saved new image (${name})`
      }
    };

    let lang = "my";
    let theme = "dark";

    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const langToggleBtn = document.getElementById("langToggleBtn");
    const fileInput = document.getElementById("fileInput");
    const mainSaveBtn = document.getElementById("mainSaveBtn");
    const exportChoices = document.getElementById("exportChoices");
    const copyImgBtn = document.getElementById("copyImgBtn");
    const downloadNewBtn = document.getElementById("downloadNewBtn");
    const mainCanvas = document.getElementById("mainCanvas");
    const ctx = mainCanvas.getContext("2d");
    const syncBox = document.getElementById("syncBox");
    const syncTextInput = document.getElementById("syncTextInput");
    const sizeInput = document.getElementById("sizeInput");
    const textColorInput = document.getElementById("textColorInput");
    const bgColorInput = document.getElementById("bgColorInput");
    const miniSaveBtn = document.getElementById("miniSaveBtn");
    const miniResetBtn = document.getElementById("miniResetBtn");
    const hintText = document.getElementById("hintText");
    const toastMsg = document.getElementById("toastMsg");

    let baseImg = null;
    let sampleCanvas = document.createElement("canvas");
    let sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

    let confirmedEdits = [];
    // liveEdit: { x, y, w, h, text, originalText, fontSize, textColor, bgColor, isDirty }
    let liveEdit = null;
    let isDragging = false;
    let dragDx = 0;
    let dragDy = 0;
    let ocrToken = 0;

    function t(k, ...a) {
      const v = i18n[lang][k];
      return typeof v === "function" ? v(...a) : v;
    }

    function applyLang() {
      document.getElementById("uploadLabel").textContent = t("uploadLabel");
      document.getElementById("syncTitle").textContent = t("syncTitle");
      syncTextInput.placeholder = t("syncPlaceholder");
      document.getElementById("lblOrigSize").textContent = t("lblOrigSize");
      document.getElementById("lblTextColor").textContent = t("lblTextColor");
      document.getElementById("lblBgColor").textContent = t("lblBgColor");
      themeToggleBtn.textContent = theme === "dark" ? t("toLight") : t("toDark");
      langToggleBtn.textContent = lang === "my" ? t("toEn") : t("toMy");
      hintText.textContent = baseImg ? t("hintActive") : t("hintInitial");
      render(true);
    }

    themeToggleBtn.addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      themeToggleBtn.textContent = theme === "dark" ? t("toLight") : t("toDark");
    });

    langToggleBtn.addEventListener("click", () => {
      lang = lang === "my" ? "en" : "my";
      document.documentElement.setAttribute("lang", lang);
      applyLang();
    });

    function showToast(msg) {
      toastMsg.textContent = msg;
      setTimeout(() => {
        if (toastMsg.textContent === msg) toastMsg.textContent = "";
      }, 3000);
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
    }

    function colorDistSq(c1, c2) {
      return (c1[0] - c2[0]) ** 2 + (c1[1] - c2[1]) ** 2 + (c1[2] - c2[2]) ** 2;
    }

    // Estimate original text size (smaller, accurate to actual line/character height)
    function detectStyleAt(cx, cy) {
      const baseScaleSize = Math.max(12, Math.min(36, Math.round(mainCanvas.height * 0.018)));
      const fallback = {
        bgColor: "#ffffff",
        textColor: "#111827",
        fontSize: baseScaleSize,
        boxW: Math.max(110, Math.round(mainCanvas.width * 0.34)),
        boxH: Math.max(22, Math.round(baseScaleSize * 1.35))
      };
      if (!baseImg) return fallback;

      const patchW = Math.max(80, Math.min(sampleCanvas.width, Math.round(sampleCanvas.width * 0.3)));
      const patchH = Math.max(22, Math.min(sampleCanvas.height, Math.round(sampleCanvas.height * 0.035)));
      const x0 = Math.max(0, Math.min(sampleCanvas.width - patchW, Math.round(cx - patchW / 2)));
      const y0 = Math.max(0, Math.min(sampleCanvas.height - patchH, Math.round(cy - patchH / 2)));

      try {
        const imgData = sampleCtx.getImageData(x0, y0, patchW, patchH).data;
        const borderColors = [];
        for (let x = 0; x < patchW; x += 2) {
          for (const y of [0, patchH - 1]) {
            const idx = (y * patchW + x) * 4;
            borderColors.push([imgData[idx], imgData[idx + 1], imgData[idx + 2]]);
          }
        }
        for (let y = 0; y < patchH; y += 2) {
          for (const x of [0, patchW - 1]) {
            const idx = (y * patchW + x) * 4;
            borderColors.push([imgData[idx], imgData[idx + 1], imgData[idx + 2]]);
          }
        }
        borderColors.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
        const bgRgb = borderColors[Math.floor(borderColors.length / 2)] || [255, 255, 255];

        let fgSum = [0, 0, 0];
        let fgCount = 0;
        const activeRows = [];

        for (let y = 0; y < patchH; y++) {
          let rowHits = 0;
          for (let x = 0; x < patchW; x++) {
            const idx = (y * patchW + x) * 4;
            const px = [imgData[idx], imgData[idx + 1], imgData[idx + 2]];
            if (colorDistSq(px, bgRgb) > 2500) {
              fgSum[0] += px[0];
              fgSum[1] += px[1];
              fgSum[2] += px[2];
              fgCount++;
              rowHits++;
            }
          }
          if (rowHits >= 2) activeRows.push(y);
        }

        let fgRgb = bgRgb[0] + bgRgb[1] + bgRgb[2] > 380 ? [15, 23, 42] : [255, 255, 255];
        if (fgCount > 5) {
          fgRgb = [fgSum[0] / fgCount, fgSum[1] / fgCount, fgSum[2] / fgCount];
        }

        let detectedSize = baseScaleSize;
        if (activeRows.length >= 4) {
          // Find contiguous row cluster near middle of patch
          const midRow = Math.floor(patchH / 2);
          let bestCluster = [activeRows[0]];
          let curCluster = [activeRows[0]];
          for (let i = 1; i < activeRows.length; i++) {
            if (activeRows[i] - activeRows[i - 1] <= 2) {
              curCluster.push(activeRows[i]);
            } else {
              if (Math.abs(curCluster[Math.floor(curCluster.length / 2)] - midRow) <
                  Math.abs(bestCluster[Math.floor(bestCluster.length / 2)] - midRow)) {
                bestCluster = curCluster;
              }
              curCluster = [activeRows[i]];
            }
          }
          if (Math.abs(curCluster[Math.floor(curCluster.length / 2)] - midRow) <
              Math.abs(bestCluster[Math.floor(bestCluster.length / 2)] - midRow)) {
            bestCluster = curCluster;
          }
          const charHeight = bestCluster[bestCluster.length - 1] - bestCluster[0] + 1;
          if (charHeight >= 8 && charHeight <= patchH * 0.9) {
            detectedSize = Math.max(10, Math.min(60, Math.round(charHeight * 1.05)));
          }
        }

        return {
          bgColor: rgbToHex(bgRgb[0], bgRgb[1], bgRgb[2]),
          textColor: rgbToHex(fgRgb[0], fgRgb[1], fgRgb[2]),
          fontSize: detectedSize,
          boxW: patchW,
          boxH: Math.max(20, Math.round(detectedSize * 1.35))
        };
      } catch (_) {
        return fallback;
      }
    }

    function drawEditItem(item, showBorder, isLive) {
      const boxH = Math.max(item.h, Math.round(item.fontSize * 1.35));
      const boxY = item.y - boxH * 0.72;

      // Live item only covers/replaces once user types or erases
      if (!isLive || item.isDirty) {
        ctx.fillStyle = item.bgColor;
        ctx.fillRect(item.x, boxY, item.w, boxH);

        if (item.text && item.text.length > 0) {
          ctx.fillStyle = item.textColor;
          ctx.font = `${item.fontSize}px sans-serif`;
          ctx.textBaseline = "middle";
          ctx.fillText(item.text, item.x + 3, boxY + boxH / 2);
          ctx.textBaseline = "alphabetic";
        }
      }

      if (showBorder) {
        ctx.save();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = Math.max(1.5, mainCanvas.width / 260);
        ctx.setLineDash([5, 3]);
        ctx.strokeRect(item.x, boxY, item.w, boxH);
        ctx.restore();
      }
    }

    function render(showOutline = true) {
      ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      if (!baseImg) {
        ctx.fillStyle = theme === "dark" ? "#94a3b8" : "#475569";
        ctx.font = "15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t("placeholderCanvas"), mainCanvas.width / 2, mainCanvas.height / 2);
        ctx.textAlign = "start";
        return;
      }

      ctx.drawImage(baseImg, 0, 0, mainCanvas.width, mainCanvas.height);

      for (const item of confirmedEdits) {
        drawEditItem(item, false, false);
      }

      if (liveEdit) {
        drawEditItem(liveEdit, showOutline, true);
      }
    }

    async function runAutoOcr(item, token) {
      if (!window.Tesseract || !item) return;
      const boxH = Math.max(item.h, Math.round(item.fontSize * 1.35));
      const boxY = Math.max(0, Math.round(item.y - boxH * 0.72));

      const cropCanvas = document.createElement("canvas");
      cropCanvas.width = Math.max(80, Math.round(item.w * 2));
      cropCanvas.height = Math.max(36, Math.round(boxH * 2));
      const cCtx = cropCanvas.getContext("2d");
      cCtx.fillStyle = "#ffffff";
      cCtx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
      cCtx.drawImage(
        sampleCanvas,
        Math.max(0, Math.round(item.x)),
        boxY,
        Math.max(10, Math.round(item.w)),
        Math.max(10, Math.round(boxH)),
        0,
        0,
        cropCanvas.width,
        cropCanvas.height
      );

      showToast(t("readingOcr"));
      try {
        const res = await Tesseract.recognize(cropCanvas.toDataURL("image/png"), "eng+mya");
        if (token !== ocrToken || !liveEdit || liveEdit.isDirty) return;
        const detected = (res?.data?.text || "").replace(/\s+/g, " ").trim();
        if (detected) {
          liveEdit.originalText = detected;
          liveEdit.text = detected;
          syncTextInput.value = detected;
          render(true);
          showToast(t("ocrDone"));
        } else {
          showToast("");
        }
      } catch (_) {
        if (token === ocrToken) showToast("");
      }
    }

    function syncInputsFromLive() {
      if (!liveEdit) return;
      syncTextInput.value = liveEdit.text;
      sizeInput.value = liveEdit.fontSize;
      textColorInput.value = liveEdit.textColor;
      bgColorInput.value = liveEdit.bgColor;
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          baseImg = img;
          mainCanvas.width = img.width;
          mainCanvas.height = img.height;

          sampleCanvas.width = img.width;
          sampleCanvas.height = img.height;
          sampleCtx.clearRect(0, 0, sampleCanvas.width, sampleCanvas.height);
          sampleCtx.drawImage(img, 0, 0);

          confirmedEdits = [];
          liveEdit = null;
          syncBox.classList.remove("show");
          exportChoices.classList.remove("show");
          mainSaveBtn.disabled = false;
          hintText.textContent = t("hintActive");
          render(true);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Live sync as user types or deletes characters
    syncTextInput.addEventListener("input", () => {
      ocrToken++;
      if (!liveEdit) return;
      liveEdit.isDirty = true;
      liveEdit.text = syncTextInput.value;
      render(true);
    });

    sizeInput.addEventListener("input", () => {
      if (!liveEdit) return;
      const sz = Number(sizeInput.value) || 16;
      liveEdit.fontSize = sz;
      liveEdit.h = Math.round(sz * 1.35);
      liveEdit.isDirty = true;
      render(true);
    });

    textColorInput.addEventListener("input", () => {
      if (!liveEdit) return;
      liveEdit.textColor = textColorInput.value;
      liveEdit.isDirty = true;
      render(true);
    });

    bgColorInput.addEventListener("input", () => {
      if (!liveEdit) return;
      liveEdit.bgColor = bgColorInput.value;
      liveEdit.isDirty = true;
      render(true);
    });

    // Small Save button below edit box: confirm on image
    miniSaveBtn.addEventListener("click", () => {
      if (!liveEdit) return;
      ocrToken++;
      confirmedEdits.push({ ...liveEdit, isDirty: true });
      liveEdit = null;
      syncBox.classList.remove("show");
      render(true);
      showToast(t("confirmed"));
    });

    // Small Reset button below edit box: restore original text in input box & clear live replacement
    miniResetBtn.addEventListener("click", () => {
      if (!liveEdit) return;
      ocrToken++;
      liveEdit.isDirty = false;
      liveEdit.text = liveEdit.originalText || "";
      syncTextInput.value = liveEdit.text;
      render(true);
      showToast(t("reverted"));
    });

    function getCoords(clientX, clientY) {
      const rect = mainCanvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * mainCanvas.width,
        y: ((clientY - rect.top) / rect.height) * mainCanvas.height
      };
    }

    function onPointerDown(clientX, clientY) {
      if (!baseImg) return;
      const pt = getCoords(clientX, clientY);

      if (liveEdit) {
        const boxH = Math.max(liveEdit.h, Math.round(liveEdit.fontSize * 1.35));
        const boxY = liveEdit.y - boxH * 0.72;
        if (pt.x >= liveEdit.x && pt.x <= liveEdit.x + liveEdit.w && pt.y >= boxY && pt.y <= boxY + boxH) {
          isDragging = true;
          dragDx = pt.x - liveEdit.x;
          dragDy = pt.y - liveEdit.y;
          return;
        }
      }

      const style = detectStyleAt(pt.x, pt.y);
      liveEdit = {
        x: Math.max(0, Math.min(mainCanvas.width - style.boxW, Math.round(pt.x - style.boxW / 2))),
        y: Math.max(20, Math.min(mainCanvas.height - 10, Math.round(pt.y + style.fontSize * 0.35))),
        w: style.boxW,
        h: style.boxH,
        text: "",
        originalText: "",
        fontSize: style.fontSize,
        textColor: style.textColor,
        bgColor: style.bgColor,
        isDirty: false
      };

      syncInputsFromLive();
      syncBox.classList.add("show");
      render(true);

      const token = ++ocrToken;
      runAutoOcr({ ...liveEdit }, token);
    }

    function onPointerMove(clientX, clientY) {
      if (!isDragging || !liveEdit) return;
      const pt = getCoords(clientX, clientY);
      liveEdit.x = Math.max(0, Math.min(mainCanvas.width - liveEdit.w, Math.round(pt.x - dragDx)));
      liveEdit.y = Math.max(20, Math.min(mainCanvas.height - 10, Math.round(pt.y - dragDy)));
      render(true);
    }

    function onPointerUp() {
      if (isDragging && liveEdit) {
        isDragging = false;
        const style = detectStyleAt(liveEdit.x + liveEdit.w / 2, liveEdit.y - liveEdit.fontSize * 0.2);
        liveEdit.fontSize = style.fontSize;
        liveEdit.h = style.boxH;
        liveEdit.textColor = style.textColor;
        liveEdit.bgColor = style.bgColor;
        syncInputsFromLive();
        render(true);
        if (!liveEdit.isDirty) {
          const token = ++ocrToken;
          runAutoOcr({ ...liveEdit }, token);
        }
      } else {
        isDragging = false;
      }
    }

    mainCanvas.addEventListener("mousedown", (e) => onPointerDown(e.clientX, e.clientY));
    window.addEventListener("mousemove", (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", onPointerUp);

    mainCanvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    mainCanvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && isDragging) {
        e.preventDefault();
        onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    mainCanvas.addEventListener("touchend", onPointerUp);

    mainSaveBtn.addEventListener("click", () => {
      if (!baseImg) return;
      if (liveEdit && liveEdit.isDirty) {
        confirmedEdits.push({ ...liveEdit });
      }
      liveEdit = null;
      syncBox.classList.remove("show");
      render(false);
      exportChoices.classList.add("show");
      showToast(t("chooseExport"));
    });

    copyImgBtn.addEventListener("click", async () => {
      if (!baseImg) return;
      try {
        render(false);
        const blob = await new Promise((r) => mainCanvas.toBlob(r, "image/png"));
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          showToast(t("copied"));
        } else {
          showToast(t("copyUnsupported"));
        }
      } catch (_) {
        showToast(t("copyFailed"));
      }
    });

    downloadNewBtn.addEventListener("click", () => {
      if (!baseImg) return;
      render(false);
      const stamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);
      const a = document.createElement("a");
      a.download = `edited-${stamp}.png`;
      a.href = mainCanvas.toDataURL("image/png");
      a.click();
      showToast(t("savedNew", a.download));
    });

    applyLang();
  </script>
</body>
</html>
