<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Image Text Replacer</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0f172a;
      --canvas-bg: #020617;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --input-border: #475569;
    }
    :root[data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-2: #f8fafc;
      --canvas-bg: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --input-border: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .app {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .top-pill-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .upload-box {
      background: var(--card);
      border: 1px dashed var(--input-border);
      border-radius: 12px;
      padding: 12px;
    }
    .upload-box label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="file"] {
      width: 100%;
      color: var(--text);
      font-size: 13px;
    }

    .btn-save-main {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      background: #10b981;
      color: #fff;
      cursor: pointer;
    }
    .btn-save-main:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-save-main:active { transform: scale(0.99); }

    .export-choices {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--card);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .export-choices.show { display: grid; }
    .sub-export-btn {
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
    }
    .btn-copy { background: #8b5cf6; }
    .btn-download-new { background: #059669; }

    .canvas-wrap {
      background: var(--canvas-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #mainCanvas {
      max-width: 100%;
      max-height: 55vh;
      border-radius: 8px;
      background: var(--card);
      touch-action: none;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .draft-box {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      flex-direction: column;
      gap: 10px;
    }
    .draft-box.show { display: flex; }
    .draft-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      gap: 8px;
    }
    .small-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .live-input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 2px solid #3b82f6;
      background: var(--card-2);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }
    .controls-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (max-width: 500px) {
      .controls-row { grid-template-columns: 1fr 1fr; }
    }
    .mini-lbl {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }
    input[type="number"], input[type="color"] {
      width: 100%;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      background: var(--card-2);
      color: var(--text);
      padding: 4px;
    }
    .toast {
      font-size: 12px;
      color: #10b981;
      text-align: center;
      min-height: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <button class="top-pill-btn" id="themeToggleBtn">☀️ Light</button>
      <button class="top-pill-btn" id="langToggleBtn">🌐 English</button>
    </div>

    <div class="upload-box">
      <label id="uploadLabel">ပုံတင်ရန် (Upload Image)</label>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <button class="btn-save-main" id="mainSaveBtn" disabled>SAVE</button>

    <div class="export-choices" id="exportChoices">
      <button class="sub-export-btn btn-copy" id="copyImgBtn">Copy</button>
      <button class="sub-export-btn btn-download-new" id="downloadNewBtn">Save</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="mainCanvas" width="500" height="500"></canvas>
      <div class="hint" id="hintText">ပုံတင်လိုက်တာနဲ့ အောက်မှာ စာသားပြောင်းရန် ဘောင်ကွက်ထွက်လာပါမယ်</div>
    </div>

    <div class="draft-box" id="draftBox">
      <div class="draft-header">
        <span id="draftTitle">စာသားကွက်လပ် (မူရင်း Size & Color အတိုင်း တိုက်ရိုက်ပြောင်းမည်)</span>
        <button class="small-btn" id="addSlotBtn">+ စာကွက်ထပ်ထည့်</button>
      </div>

      <input type="text" class="live-input" id="liveTextInput" placeholder="စာသားဟောင်းကို ဖျက်ပြီး ကြိုက်တဲ့စာ ရိုက်ထည့်ပါ..." />

      <div class="controls-row">
        <div>
          <span class="mini-lbl" id="lblTextColor">စာသားအရောင်</span>
          <input type="color" id="textColorInput" value="#ffffff" />
        </div>
        <div>
          <span class="mini-lbl" id="lblBgColor">နောက်ခံဖုံးအရောင်</span>
          <input type="color" id="bgColorInput" value="#000000" />
        </div>
        <div>
          <span class="mini-lbl" id="lblFontSize">စာလုံးဆိုဒ်</span>
          <input type="number" id="fontSizeInput" value="32" min="8" max="250" />
        </div>
        <div>
          <span class="mini-lbl" id="lblBoxSize">ဖုံးအုပ်ဘောင်အကျယ်</span>
          <input type="number" id="boxWidthInput" value="220" min="20" max="2000" />
        </div>
      </div>
    </div>

    <div class="toast" id="toastMsg"></div>
  </div>

  <script>
    const i18n = {
      my: {
        toLight: "☀️ Light",
        toDark: "🌙 Dark",
        toEn: "🌐 English",
        toMy: "🌐 မြန်မာ",
        uploadLabel: "ပုံတင်ရန် (Upload Image)",
        placeholderCanvas: "ပုံတစ်ပုံ ရွေးချယ်ပါ",
        hintInitial: "ပုံတင်လိုက်တာနဲ့ အောက်မှာ စာသားပြောင်းရန် ဘောင်ကွက်ထွက်လာပါမယ်",
        hintActive: "ပုံပေါ်က ပြင်ချင်တဲ့စာကို နှိပ်ပြီး အောက်ကွက်မှာ စာရိုက်ပါ (Size & Color အလိုအလျောက် ယူပေးသည်)",
        draftTitle: "စာသားကွက်လပ် (မူရင်း Size & Color အတိုင်း တိုက်ရိုက်ပြောင်းမည်)",
        addSlot: "+ စာကွက်ထပ်ထည့်",
        inputPlaceholder: "စာသားဟောင်းကို ဖျက်ပြီး ကြိုက်တဲ့စာ ရိုက်ထည့်ပါ...",
        lblTextColor: "စာသားအရောင်",
        lblBgColor: "နောက်ခံဖုံးအရောင်",
        lblFontSize: "စာလုံးဆိုဒ်",
        lblBoxSize: "ဖုံးအုပ်ဘောင်အကျယ်",
        chooseExport: "အောက်မှ Copy သို့မဟုတ် Save ကို ရွေးပါ",
        copied: "ပုံကို Copy ကူးပြီးပါပြီ",
        copyUnsupported: "ဒီ Browser မှာ Copy မပံ့ပိုးပါ၊ Save ကိုနှိပ်ပါ",
        copyFailed: "Copy ကူးမရပါ၊ Save ကိုနှိပ်၍ သိမ်းပါ",
        savedNew: (name) => `ပုံအသစ် (${name}) သိမ်းဆည်းပြီးပါပြီ`
      },
      en: {
        toLight: "☀️ Light",
        toDark: "🌙 Dark",
        toEn: "🌐 English",
        toMy: "🌐 မြန်မာ",
        uploadLabel: "Upload Image",
        placeholderCanvas: "Choose an image",
        hintInitial: "Upload an image to open the live text box below",
        hintActive: "Tap text on image and type below (auto-matches original size & color)",
        draftTitle: "Text Box (Live edit matching original size & color)",
        addSlot: "+ Add Text Slot",
        inputPlaceholder: "Clear and type your new text...",
        lblTextColor: "Text Color",
        lblBgColor: "Cover Color",
        lblFontSize: "Font Size",
        lblBoxSize: "Cover Width",
        chooseExport: "Choose Copy or Save below",
        copied: "Image copied to clipboard",
        copyUnsupported: "Copy not supported here; use Save",
        copyFailed: "Could not copy; use Save instead",
        savedNew: (name) => `Saved new image (${name})`
      }
    };

    let lang = "my";
    let theme = "dark";

    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const langToggleBtn = document.getElementById("langToggleBtn");
    const fileInput = document.getElementById("fileInput");
    const mainSaveBtn = document.getElementById("mainSaveBtn");
    const exportChoices = document.getElementById("exportChoices");
    const copyImgBtn = document.getElementById("copyImgBtn");
    const downloadNewBtn = document.getElementById("downloadNewBtn");
    const mainCanvas = document.getElementById("mainCanvas");
    const ctx = mainCanvas.getContext("2d");
    const draftBox = document.getElementById("draftBox");
    const liveTextInput = document.getElementById("liveTextInput");
    const textColorInput = document.getElementById("textColorInput");
    const bgColorInput = document.getElementById("bgColorInput");
    const fontSizeInput = document.getElementById("fontSizeInput");
    const boxWidthInput = document.getElementById("boxWidthInput");
    const addSlotBtn = document.getElementById("addSlotBtn");
    const hintText = document.getElementById("hintText");
    const toastMsg = document.getElementById("toastMsg");

    let baseImg = null;
    let sampleCanvas = document.createElement("canvas");
    let sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

    // slots: { text, x, y, w, h, textColor, bgColor, fontSize }
    let slots = [];
    let currentIdx = 0;
    let isDragging = false;
    let dragDx = 0;
    let dragDy = 0;

    function t(k, ...a) {
      const v = i18n[lang][k];
      return typeof v === "function" ? v(...a) : v;
    }

    function applyLang() {
      document.getElementById("uploadLabel").textContent = t("uploadLabel");
      document.getElementById("draftTitle").textContent = t("draftTitle");
      addSlotBtn.textContent = t("addSlot");
      liveTextInput.placeholder = t("inputPlaceholder");
      document.getElementById("lblTextColor").textContent = t("lblTextColor");
      document.getElementById("lblBgColor").textContent = t("lblBgColor");
      document.getElementById("lblFontSize").textContent = t("lblFontSize");
      document.getElementById("lblBoxSize").textContent = t("lblBoxSize");
      themeToggleBtn.textContent = theme === "dark" ? t("toLight") : t("toDark");
      langToggleBtn.textContent = lang === "my" ? t("toEn") : t("toMy");
      hintText.textContent = baseImg ? t("hintActive") : t("hintInitial");
      render(true);
    }

    themeToggleBtn.addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      themeToggleBtn.textContent = theme === "dark" ? t("toLight") : t("toDark");
    });

    langToggleBtn.addEventListener("click", () => {
      lang = lang === "my" ? "en" : "my";
      document.documentElement.setAttribute("lang", lang);
      applyLang();
    });

    function showToast(msg) {
      toastMsg.textContent = msg;
      setTimeout(() => {
        if (toastMsg.textContent === msg) toastMsg.textContent = "";
      }, 2800);
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
    }

    function colorDistSq(c1, c2) {
      const dr = c1[0] - c2[0];
      const dg = c1[1] - c2[1];
      const db = c1[2] - c2[2];
      return dr * dr + dg * dg + db * db;
    }

    // Detect original background color, text color, and font size around (cx, cy)
    function detectOriginalStyle(cx, cy) {
      const fallback = {
        bgColor: "#ffffff",
        textColor: "#111827",
        fontSize: Math.max(16, Math.round(mainCanvas.height * 0.035))
      };
      if (!baseImg) return fallback;

      const patchW = Math.max(60, Math.min(sampleCanvas.width, Math.round(sampleCanvas.width * 0.24)));
      const patchH = Math.max(24, Math.min(sampleCanvas.height, Math.round(sampleCanvas.height * 0.06)));
      const x0 = Math.max(0, Math.min(sampleCanvas.width - patchW, Math.round(cx - patchW / 2)));
      const y0 = Math.max(0, Math.min(sampleCanvas.height - patchH, Math.round(cy - patchH / 2)));

      try {
        const imgData = sampleCtx.getImageData(x0, y0, patchW, patchH).data;

        // Collect border / background candidate colors
        const borderColors = [];
        for (let x = 0; x < patchW; x += 2) {
          for (const y of [0, patchH - 1]) {
            const idx = (y * patchW + x) * 4;
            borderColors.push([imgData[idx], imgData[idx + 1], imgData[idx + 2]]);
          }
        }
        for (let y = 0; y < patchH; y += 2) {
          for (const x of [0, patchW - 1]) {
            const idx = (y * patchW + x) * 4;
            borderColors.push([imgData[idx], imgData[idx + 1], imgData[idx + 2]]);
          }
        }

        // Pick median-like background color from border samples
        borderColors.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
        const bgRgb = borderColors[Math.floor(borderColors.length / 2)] || [255, 255, 255];

        // Find pixels that differ from background (likely text pixels)
        let fgSum = [0, 0, 0];
        let fgCount = 0;
        const textRowSet = new Set();
        let minTy = patchH;
        let maxTy = -1;

        for (let y = 0; y < patchH; y++) {
          let rowHasFg = false;
          for (let x = 0; x < patchW; x++) {
            const idx = (y * patchW + x) * 4;
            const px = [imgData[idx], imgData[idx + 1], imgData[idx + 2]];
            if (colorDistSq(px, bgRgb) > 2200) {
              fgSum[0] += px[0];
              fgSum[1] += px[1];
              fgSum[2] += px[2];
              fgCount++;
              rowHasFg = true;
              if (y < minTy) minTy = y;
              if (y > maxTy) maxTy = y;
            }
          }
          if (rowHasFg) textRowSet.add(y);
        }

        let fgRgb = bgRgb[0] + bgRgb[1] + bgRgb[2] > 380 ? [15, 23, 42] : [255, 255, 255];
        if (fgCount > 6) {
          fgRgb = [fgSum[0] / fgCount, fgSum[1] / fgCount, fgSum[2] / fgCount];
        }

        // Estimate text height from vertical span of foreground pixels near center
        let detectedSize = fallback.fontSize;
        if (maxTy > minTy && fgCount > 6) {
          const spanH = maxTy - minTy + 1;
          detectedSize = Math.max(10, Math.min(200, Math.round(spanH * 0.92)));
        }

        return {
          bgColor: rgbToHex(bgRgb[0], bgRgb[1], bgRgb[2]),
          textColor: rgbToHex(fgRgb[0], fgRgb[1], fgRgb[2]),
          fontSize: detectedSize
        };
      } catch (_) {
        return fallback;
      }
    }

    function syncInputsFromSlot() {
      const s = slots[currentIdx];
      if (!s) return;
      liveTextInput.value = s.text;
      textColorInput.value = s.textColor;
      bgColorInput.value = s.bgColor;
      fontSizeInput.value = s.fontSize;
      boxWidthInput.value = s.w;
    }

    function render(showOutline = true) {
      ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      if (!baseImg) {
        ctx.fillStyle = theme === "dark" ? "#94a3b8" : "#475569";
        ctx.font = "15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t("placeholderCanvas"), mainCanvas.width / 2, mainCanvas.height / 2);
        ctx.textAlign = "start";
        return;
      }

      ctx.drawImage(baseImg, 0, 0, mainCanvas.width, mainCanvas.height);

      slots.forEach((s, idx) => {
        const boxH = Math.max(s.h, Math.round(s.fontSize * 1.3));
        const boxY = s.y - boxH * 0.72;

        if (s.text.length > 0) {
          ctx.fillStyle = s.bgColor;
          ctx.fillRect(s.x - 4, boxY, s.w, boxH);

          ctx.fillStyle = s.textColor;
          ctx.font = `bold ${s.fontSize}px sans-serif`;
          ctx.textBaseline = "middle";
          ctx.fillText(s.text, s.x + 2, boxY + boxH / 2);
          ctx.textBaseline = "alphabetic";
        }

        if (showOutline && idx === currentIdx) {
          ctx.save();
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = Math.max(2, mainCanvas.width / 220);
          ctx.setLineDash([6, 4]);
          ctx.strokeRect(s.x - 4, boxY, s.w, boxH);
          ctx.restore();
        }
      });
    }

    function createSlotAt(x, y, offsetY = 0) {
      const targetY = Math.max(20, Math.min(mainCanvas.height - 10, y + offsetY));
      const style = detectOriginalStyle(x, targetY);
      const fs = style.fontSize;
      const bw = Math.max(110, Math.round(mainCanvas.width * 0.36));
      const bh = Math.round(fs * 1.3);
      return {
        text: "",
        x: Math.max(0, Math.min(mainCanvas.width - bw, Math.round(x - bw / 2))),
        y: targetY,
        w: bw,
        h: bh,
        textColor: style.textColor,
        bgColor: style.bgColor,
        fontSize: fs
      };
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          baseImg = img;
          mainCanvas.width = img.width;
          mainCanvas.height = img.height;

          sampleCanvas.width = img.width;
          sampleCanvas.height = img.height;
          sampleCtx.clearRect(0, 0, sampleCanvas.width, sampleCanvas.height);
          sampleCtx.drawImage(img, 0, 0);

          slots = [createSlotAt(img.width / 2, img.height / 2, 0)];
          currentIdx = 0;
          syncInputsFromSlot();
          draftBox.classList.add("show");
          exportChoices.classList.remove("show");
          mainSaveBtn.disabled = false;
          hintText.textContent = t("hintActive");
          render(true);
          liveTextInput.focus();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    addSlotBtn.addEventListener("click", () => {
      if (!baseImg) return;
      slots.push(createSlotAt(mainCanvas.width / 2, mainCanvas.height / 2, slots.length * 36));
      currentIdx = slots.length - 1;
      syncInputsFromSlot();
      render(true);
      liveTextInput.focus();
    });

    liveTextInput.addEventListener("input", () => {
      if (!slots[currentIdx]) return;
      slots[currentIdx].text = liveTextInput.value;
      render(true);
    });

    textColorInput.addEventListener("input", () => {
      if (!slots[currentIdx]) return;
      slots[currentIdx].textColor = textColorInput.value;
      render(true);
    });

    bgColorInput.addEventListener("input", () => {
      if (!slots[currentIdx]) return;
      slots[currentIdx].bgColor = bgColorInput.value;
      render(true);
    });

    fontSizeInput.addEventListener("input", () => {
      if (!slots[currentIdx]) return;
      const v = Number(fontSizeInput.value) || 20;
      slots[currentIdx].fontSize = v;
      slots[currentIdx].h = Math.round(v * 1.3);
      render(true);
    });

    boxWidthInput.addEventListener("input", () => {
      if (!slots[currentIdx]) return;
      slots[currentIdx].w = Number(boxWidthInput.value) || 120;
      render(true);
    });

    function getCoords(clientX, clientY) {
      const rect = mainCanvas.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * mainCanvas.width,
        y: ((clientY - rect.top) / rect.height) * mainCanvas.height
      };
    }

    function onDown(clientX, clientY) {
      if (!baseImg || !slots.length) return;
      const pt = getCoords(clientX, clientY);

      for (let i = slots.length - 1; i >= 0; i--) {
        const s = slots[i];
        const boxH = Math.max(s.h, Math.round(s.fontSize * 1.3));
        const boxY = s.y - boxH * 0.72;
        if (pt.x >= s.x - 10 && pt.x <= s.x + s.w + 10 && pt.y >= boxY - 10 && pt.y <= boxY + boxH + 10) {
          currentIdx = i;
          syncInputsFromSlot();
          isDragging = true;
          dragDx = pt.x - s.x;
          dragDy = pt.y - s.y;
          render(true);
          return;
        }
      }

      // Tap a new spot on the image -> match original size & colors automatically
      const cur = slots[currentIdx];
      const detected = detectOriginalStyle(pt.x, pt.y);
      cur.fontSize = detected.fontSize;
      cur.h = Math.round(detected.fontSize * 1.3);
      cur.textColor = detected.textColor;
      cur.bgColor = detected.bgColor;
      cur.x = Math.max(0, Math.min(mainCanvas.width - cur.w, Math.round(pt.x - cur.w / 2)));
      cur.y = Math.max(20, Math.min(mainCanvas.height - 10, Math.round(pt.y)));
      syncInputsFromSlot();

      isDragging = true;
      dragDx = pt.x - cur.x;
      dragDy = pt.y - cur.y;
      render(true);
    }

    function onMove(clientX, clientY) {
      if (!isDragging || !slots[currentIdx]) return;
      const pt = getCoords(clientX, clientY);
      slots[currentIdx].x = Math.max(0, Math.min(mainCanvas.width - slots[currentIdx].w, Math.round(pt.x - dragDx)));
      slots[currentIdx].y = Math.max(20, Math.min(mainCanvas.height - 10, Math.round(pt.y - dragDy)));
      render(true);
    }

    function onUp() {
      if (isDragging && slots[currentIdx]) {
        const cur = slots[currentIdx];
        const centerX = cur.x + cur.w / 2;
        const centerY = cur.y - cur.fontSize * 0.25;
        const detected = detectOriginalStyle(centerX, centerY);
        cur.fontSize = detected.fontSize;
        cur.h = Math.round(detected.fontSize * 1.3);
        cur.textColor = detected.textColor;
        cur.bgColor = detected.bgColor;
        syncInputsFromSlot();
        render(true);
      }
      isDragging = false;
    }

    mainCanvas.addEventListener("mousedown", (e) => onDown(e.clientX, e.clientY));
    window.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", onUp);

    mainCanvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) onDown(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    mainCanvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && isDragging) {
        e.preventDefault();
        onMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    mainCanvas.addEventListener("touchend", onUp);

    mainSaveBtn.addEventListener("click", () => {
      if (!baseImg) return;
      render(false);
      exportChoices.classList.add("show");
      showToast(t("chooseExport"));
    });

    copyImgBtn.addEventListener("click", async () => {
      if (!baseImg) return;
      try {
        render(false);
        const blob = await new Promise((r) => mainCanvas.toBlob(r, "image/png"));
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          showToast(t("copied"));
        } else {
          showToast(t("copyUnsupported"));
        }
      } catch (_) {
        showToast(t("copyFailed"));
      }
    });

    downloadNewBtn.addEventListener("click", () => {
      if (!baseImg) return;
      render(false);
      const stamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);
      const a = document.createElement("a");
      a.download = `edited-${stamp}.png`;
      a.href = mainCanvas.toDataURL("image/png");
      a.click();
      showToast(t("savedNew", a.download));
    });

    applyLang();
  </script>
</body>
</html>
